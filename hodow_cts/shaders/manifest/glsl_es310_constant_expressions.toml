rust_const = "GLSL_ES310_CONSTANT_EXPRESSIONS_OTHER_NESTED_BUILTIN_FUNCS_COMPUTE"
rust_type = "SharedProgram"
programs = [ { name = "compute_0", template = "glsl/source.comp", stage = "comp" } ]
derived = { source_comp = "'#version 310 es\\nprecision highp float;\\nlayout(local_size_x = 1) in;\\n\\nlayout(binding = 0, std140) uniform Reference\\n{\\n\\tfloat out0;\\n} ref;\\nlayout(set = 0, binding = 3, std430) writeonly buffer ResultBlock\\n{\\n\\tuint result;\\n} res;\\n\\nbool isOk (float a, float b, float eps) { return (abs(a-b) <= (eps*abs(b) + eps)); }\\nfloat out0;\\nhighp vec4 dEQP_Position;\\n\\n\\nvoid main()\\n{\\n    const float a = sqrt( atan(sin(1.5)/cos(1.5)) /*1.5*/ * log2(exp2(log(exp(6.2) + 0.1)) + 0.1) /*~6.2*/);\\n    out0 = a;\\n    bool RES = isOk(out0, ref.out0, 0.05);\\nres.result = RES ? 1u : 0u;\\n\\n}\\n'" }

[[case]]
name = "other.complex_vertex"
rust_const = "GLSL_ES310_CONSTANT_EXPRESSIONS_OTHER_COMPLEX_VERTEX"
rust_type = "SharedProgram"
programs = [ { name = "vertex", template = "glsl/source.vert", stage = "vert" }, { name = "fragment", template = "glsl/source.frag", stage = "frag" } ]
derived = { source_vert = "'#version 310 es\\nprecision highp float;\\nlayout(location = 0) in highp vec4 dEQP_Position;\\nlayout(location = 1) in float in0;\\nlayout(location = 0) flat out int out0;\\n\\n\\nstruct T\\n{\\n    vec4 v;\\n};\\n\\nstruct S\\n{\\n    T t;\\n    int i;\\n    bool b;\\n};\\n\\nvoid main()\\n{\\n    const T   t  = T(vec4(1.0));\\n    const S   s  = S(t, 42, true);\\n    const int _0 = int(sin(0.0));\\n    const int _1 = int(1.0);\\n    const int _2 = 2 + int(float(_0>_1));\\n    const int _3 = min(gl_MaxVertexAttribs, 16)/4 - 1;\\n    const int _4 = min(gl_MaxDrawBuffers, 4);\\n    const ivec4 nums = ivec4(0, 1, 2, 3);\\n\\n    switch(int(in0))\\n    {\\n        case int(float(_0)):\\n            out0 = ((true!=false) && (!false)) ? 0 : 25;\\n            break;\\n        case ivec3(_1).x:\\n            out0 = 3*18/9-5;\\n            break;\\n        case nums[_2]:\\n            out0 = int(length(vec4(1.0))+0.001);\\n            break;\\n        case _3:\\n            out0 = 3;\\n            break;\\n        case clamp(_4, 1, 6):\\n            out0 = (s.i-2)/10;\\n            break;\\n        case max(3, 5):\\n            out0 = 10;\\n            break;\\n        default:\\n            out0 = 100;\\n\\n    }\\n    gl_Position = dEQP_Position;\\n\\n}\\n'", source_frag = "'#version 310 es\\nprecision highp float;\\nprecision highp int;\\n\\nlayout(location = 0) out mediump vec4 dEQP_FragColor;\\n\\nbool isOk (int a, int b)     { return (a == b); }\\n\\nlayout(location = 0) flat in int out0;\\nlayout(binding = 0, std140) uniform Reference\\n{\\n\\tint out0;\\n} ref;\\n\\nvoid main()\\n{\\n    bool RES = isOk(out0, ref.out0);\\ndEQP_FragColor = vec4(RES, RES, RES, 1.0);\\n}\\n'" }

[[case]]
name = "other.complex_fragment"
rust_const = "GLSL_ES310_CONSTANT_EXPRESSIONS_OTHER_COMPLEX_FRAGMENT"
rust_type = "SharedProgram"
programs = [ { name = "vertex", template = "glsl/source.vert", stage = "vert" }, { name = "fragment", template = "glsl/source.frag", stage = "frag" } ]
derived = { source_vert = "'#version 310 es\\nprecision highp float;\\nprecision highp int;\\n\\nlayout(location = 0) in highp vec4 dEQP_Position;\\nlayout(location = 1) in float a_in0;\\nlayout(location = 0) flat out float in0;\\n\\nvoid main()\\n{\\n    gl_Position = dEQP_Position;\\n    in0 = a_in0;\\n}\\n'", source_frag = "'#version 310 es\\nprecision highp float;\\nbool isOk (int a, int b)     { return (a == b); }\\nlayout(location = 0) out mediump vec4 dEQP_FragColor;\\nlayout(location = 0) flat in float in0;\\nlayout(binding = 0, std140) uniform Reference\\n{\\n\\tint out0;\\n} ref;\\nint out0;\\n\\n\\nstruct T\\n{\\n    vec4 v;\\n};\\n\\nstruct S\\n{\\n    T t;\\n    int i;\\n    bool b;\\n};\\n\\nvoid main()\\n{\\n    const T   t  = T(vec4(1.0));\\n    const S   s  = S(t, 42, true);\\n    const int _0 = int(sin(0.0));\\n    const int _1 = int(1.0);\\n    const int _2 = 2 + int(float(_0>_1));\\n    const int _3 = min(gl_MaxVertexAttribs, 16)/4 - 1;\\n    const int _4 = min(gl_MaxDrawBuffers, 4);\\n    const ivec4 nums = ivec4(0, 1, 2, 3);\\n\\n    switch(int(in0))\\n    {\\n        case int(float(_0)):\\n            out0 = ((true!=false) && (!false)) ? 0 : 25;\\n            break;\\n        case ivec3(_1).x:\\n            out0 = 3*18/9-5;\\n            break;\\n        case nums[_2]:\\n            out0 = int(length(vec4(1.0))+0.001);\\n            break;\\n        case _3:\\n            out0 = 3;\\n            break;\\n        case clamp(_4, 1, 6):\\n            out0 = (s.i-2)/10;\\n            break;\\n        case max(3, 5):\\n            out0 = 10;\\n            break;\\n        default:\\n            out0 = 100;\\n\\n    }\\n    bool RES = isOk(out0, ref.out0);\\ndEQP_FragColor = vec4(RES, RES, RES, 1.0);\\n\\n}\\n'" }

[[case]]
name = "other.complex_compute"
rust_const = "GLSL_ES310_CONSTANT_EXPRESSIONS_OTHER_COMPLEX_COMPUTE"
rust_type = "SharedProgram"
programs = [ { name = "compute_0", template = "glsl/source.comp", stage = "comp" } ]
derived = { source_comp = "'#version 310 es\\nprecision highp float;\\nlayout(local_size_x = 1) in;\\n\\nlayout(set = 0, binding = 2, std430) readonly buffer InputBlock\\n{\\n\\tfloat in0;\\n};\\n\\nlayout(binding = 0, std140) uniform Reference\\n{\\n\\tint out0;\\n} ref;\\nlayout(set = 0, binding = 3, std430) writeonly buffer ResultBlock\\n{\\n\\tuint result;\\n} res;\\n\\nbool isOk (int a, int b)     { return (a == b); }\\nint out0;\\nhighp vec4 dEQP_Position;\\n\\n\\nstruct T\\n{\\n    vec4 v;\\n};\\n\\nstruct S\\n{\\n    T t;\\n    int i;\\n    bool b;\\n};\\n\\nvoid main()\\n{\\n    const T   t  = T(vec4(1.0));\\n    const S   s  = S(t, 42, true);\\n    const int _0 = int(sin(0.0));\\n    const int _1 = int(1.0);\\n    const int _2 = 2 + int(float(_0>_1));\\n    const int _3 = min(gl_MaxVertexAttribs, 16)/4 - 1;\\n    const int _4 = min(gl_MaxDrawBuffers, 4);\\n    const ivec4 nums = ivec4(0, 1, 2, 3);\\n\\n    switch(int(in0))\\n    {\\n        case int(float(_0)):\\n            out0 = ((true!=false) && (!false)) ? 0 : 25;\\n            break;\\n        case ivec3(_1).x:\\n            out0 = 3*18/9-5;\\n            break;\\n        case nums[_2]:\\n            out0 = int(length(vec4(1.0))+0.001);\\n            break;\\n        case _3:\\n            out0 = 3;\\n            break;\\n        case clamp(_4, 1, 6):\\n            out0 = (s.i-2)/10;\\n            break;\\n        case max(3, 5):\\n            out0 = 10;\\n            break;\\n        default:\\n            out0 = 100;\\n\\n    }\\n    bool RES = isOk(out0, ref.out0);\\nres.result = RES ? 1u : 0u;\\n\\n}\\n'" }
