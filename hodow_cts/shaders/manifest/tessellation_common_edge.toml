# Shader manifest for dEQP-VK.tessellation.common_edge.*
#
# `initPrograms`: one case per (primitive type, spacing, case type). The vertex and fragment shaders are shared; the
# control shader depends on the primitive type and on whether the case uses `precise`, the evaluation shader on all three.

upstream_source = "external/vulkancts/modules/vulkan/tessellation/vktTessellationCommonEdgeTests.cpp"
rust_module = "tessellation/common_edge_tests"

[[case]]
name = "triangles_equal_spacing"
rust_const = "COMMON_EDGE_TRIANGLES_EQUAL_SPACING"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "tessellation/common_edge.vert", stage = "vert" },
    { name = "tesc", template = "tessellation/common_edge_triangles_basic.tesc", stage = "tesc" },
    { name = "tese", template = "tessellation/common_edge_triangles_equal_spacing_basic.tese", stage = "tese" },
    { name = "frag", template = "tessellation/common_edge.frag", stage = "frag" },
]

