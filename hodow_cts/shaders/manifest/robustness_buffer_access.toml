# Shader manifest for dEQP-VK.robustness.buffer_access.*
#
# `RobustBufferAccessTest::initBufferAccessPrograms`: the stage under test copies from an input buffer (uniform or storage, or a
# texel buffer) to a storage buffer through an index read from a uniform block, the other graphics stage is a plain pass-through.
# The source depends on the stage, the copy kind, the format class and whether the input is read from storage.

upstream_source = "external/vulkancts/modules/vulkan/robustness/vktRobustnessBufferAccessTests.cpp"
rust_module = "robustness/buffer_access_tests"

