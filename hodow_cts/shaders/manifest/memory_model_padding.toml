# Shader manifest for dEQP-VK.memory_model.padding.test
#
# `PaddingTest::initPrograms`: copies a std140 uniform block to a storage block member by member, which must leave the
# padding bytes of the destination alone. SPIR-V 1.3 is the default target here, as upstream's SPIRV_VERSION_1_3.

upstream_source = "external/vulkancts/modules/vulkan/memory_model/vktMemoryModelPadding.cpp"
rust_module = "memory_model/padding_tests"

[[case]]
name = "padding"
rust_const = "PADDING"
rust_type = "SharedProgram"
programs = [{ name = "comp", template = "memory_model/padding.comp", stage = "comp" }]
