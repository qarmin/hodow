# Shader manifest for dEQP-VK.compute.pipeline.workgroup_memory_explicit_layout.zero.*
#
# Upstream builds one shader per case in ZeroTest::initPrograms. The `elements` field
# of the CaseDef only ever reaches CaseDef::testName(), never initPrograms, so the four
# `_array_1` .. `_array_4` cases of a (zeroElementType, fieldType[0], fieldType[1])
# triple all compile to the same SPIR-V. That is why 2200 test cases need only the 550
# shaders declared here, and why the 1..4 loop lives in the Rust instead.
#
# The types themselves cannot ride on specialization constants - GLSL has no way to
# select a type at pipeline-creation time - so every triple really is its own shader.
#
# WARNING: these shaders need SPIR-V 1.4 (a `shared` block is the
# SPV_KHR_workgroup_memory_explicit_layout capability, which glslang refuses to emit
# below 1.4), and scripts/compile_shaders.py hardcodes `--target-env vulkan1.1`, i.e.
# SPIR-V 1.3. Compiling this manifest needs the generator to pass
# `--target-env spirv1.4` for these programs; see the porting notes in
# src/vkt/tests/compute/workgroup_memory_explicit_layout_zero_tests.rs.

upstream_source = "external/vulkancts/modules/vulkan/compute/vktComputeWorkgroupMemoryExplicitLayoutTests.cpp"
# GL_EXT_shared_memory_block is the SPIR-V WorkgroupMemoryExplicitLayoutKHR
# capability, which glslang only emits at SPIR-V 1.4 or higher. Upstream builds this
# file with vk::SPIRV_VERSION_1_4. Set per manifest, not globally: raising the floor
# for the other groups would silently change SPIR-V that is already generated.
spirv_version = "spirv1.4"
rust_module = "compute/workgroup_memory_explicit_layout_zero_tests"


[[case]]
name = "uint_to_float"
rust_const = "UINT_TO_FLOAT"
rust_type = "ZeroProgram"
programs = [{ name = "comp", template = "compute/wmel_zero_one_field.comp", stage = "comp" }]
[case.params]
zero_element_type = { type = "enum:DataType", value = "Uint" }
field_type_0 = { type = "enum:DataType", value = "Float" }
field_type_1 = { type = "enum:DataType", value = "Invalid" }
[case.derived]
zero_type_name = "'uint'"
zero_lit_one = "'uint(1)'"
zero_lit_zero = "'uint(0)'"
field_0_type_name = "'float'"
field_0_lit_zero = "'float(0)'"

[[case]]
name = "uint_to_vec4"
rust_const = "UINT_TO_VEC4"
rust_type = "ZeroProgram"
programs = [{ name = "comp", template = "compute/wmel_zero_one_field.comp", stage = "comp" }]
[case.params]
zero_element_type = { type = "enum:DataType", value = "Uint" }
field_type_0 = { type = "enum:DataType", value = "FloatVec4" }
field_type_1 = { type = "enum:DataType", value = "Invalid" }
[case.derived]
zero_type_name = "'uint'"
zero_lit_one = "'uint(1)'"
zero_lit_zero = "'uint(0)'"
field_0_type_name = "'vec4'"
field_0_lit_zero = "'vec4(float(0), float(0), float(0), float(0))'"

