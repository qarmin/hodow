# Shader manifest for dEQP-VK.renderpasses.renderpass2.depth_stencil_resolve.*
#
# Generated by scripts/gen_ds_resolve_shaders.py together with the GLSL it names;
# do not hand-edit either. One case holding all five: which of them a test uses is
# decided by three independent parameters, so enumerating the sets would be more
# entries than there are shaders. The `misc` group is a separate upstream test
# class with its own two shaders, so it gets its own case.

upstream_source = "external/vulkancts/modules/vulkan/renderpass/vktRenderPassDepthStencilResolveTests.cpp"
rust_module = "renderpass/depth_stencil_resolve_tests"

[[case]]
name = "ds_resolve"
rust_const = "DS_RESOLVE_PROGRAMS"
rust_type = "DsResolvePrograms"
programs = [
    { name = "quad_vert", template = "renderpass/generated/ds_resolve_quad_vert.vert", stage = "vert" },
    { name = "quad_geom", template = "renderpass/generated/ds_resolve_quad_geom.geom", stage = "geom" },
    { name = "quad_frag_depth", template = "renderpass/generated/ds_resolve_quad_frag_depth.frag", stage = "frag" },
    { name = "quad_frag_stencil", template = "renderpass/generated/ds_resolve_quad_frag_stencil.frag", stage = "frag" },
    { name = "quad_frag_stencil_sample_mask", template = "renderpass/generated/ds_resolve_quad_frag_stencil_sample_mask.frag", stage = "frag" },
]

[[case]]
name = "ds_resolve_misc"
rust_const = "DS_RESOLVE_MISC_PROGRAMS"
rust_type = "DsResolvePrograms"
programs = [
    { name = "vert", template = "renderpass/generated/ds_resolve_misc_vert.vert", stage = "vert" },
    { name = "frag", template = "renderpass/generated/ds_resolve_misc_frag.frag", stage = "frag" },
]
