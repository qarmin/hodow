# Shader manifest for dEQP-VK.shader_object.misc.*
#
# `ShaderObjectMiscCase`, `ShaderObjectUnusedBuiltinCase` (`stage` 1 vert, 2 tesc, 3 tese, 4 geom declares an output or a builtin write that
# nothing consumes, picked by `builtin`), `ShaderObjectTessellationModesCase` (`subdivision` 1 or 2, `spacing` 0 equal, 1 even, 2 odd),
# `tessPatchNonMatchInitPrograms` and `ShaderObjectPushConstCase` (one fragment shader per case, named after offset, count and whether
# every byte is in the layout).

upstream_source = "external/vulkancts/modules/vulkan/shader_object/vktShaderObjectMiscTests.cpp"
rust_module = "shader_object/misc_tests"

[[case]]
name = "blend"
rust_const = "MISC_BLEND"
rust_type = "SharedProgram"
programs = [
    { name = "inputVert", template = "shader_object/misc/input.vert", stage = "vert" },
    { name = "multiFrag", template = "shader_object/misc/multi.frag", stage = "frag" },
]

[[case]]
name = "unused_vert_output"
rust_const = "MISC_UNUSED_VERT_OUTPUT"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "shader_object/misc/unused.vert", stage = "vert" },
    { name = "tesc", template = "shader_object/misc/unused.tesc", stage = "tesc" },
    { name = "tese", template = "shader_object/misc/unused.tese", stage = "tese" },
    { name = "geom", template = "shader_object/misc/unused.geom", stage = "geom" },
    { name = "frag", template = "shader_object/basic.frag", stage = "frag" },
]
derived = { stage = "1", builtin = "0" }

