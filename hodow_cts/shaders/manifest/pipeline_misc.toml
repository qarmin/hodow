    { name = "vert", template = "pipeline/misc/descriptor_bind.vert", stage = "vert" },
    { name = "frag", template = "pipeline/misc/descriptor_bind_holes.frag", stage = "frag" },
]

[[case]]
name = "identically_defined_layout"
rust_const = "MISC_IDENTICALLY_DEFINED_LAYOUT"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "pipeline/misc/identically_defined.vert", stage = "vert" },
