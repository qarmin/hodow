# Shader manifest for dEQP-VK.pipeline.monolithic.multisample_interpolation.*
#
# One case per `MSCase<...>::initPrograms`; the consistency cases are split by `ComponentSource` the way upstream's
# initPrograms branches on it (all components, a constant component 0/1, a push constant component).

upstream_source = "external/vulkancts/modules/vulkan/pipeline/vktPipelineMultisampleInterpolationTests.cpp"
rust_module = "pipeline/multisample_interpolation_tests"

[[case]]
name = "distinct_sample_qualifier"
rust_const = "DISTINCT_SAMPLE_QUALIFIER"
rust_type = "SharedProgram"
programs = [
    { name = "vertex_shader", template = "pipeline/multisample_interpolation/distinct_values.vert", stage = "vert" },
    { name = "fragment_shader", template = "pipeline/multisample_interpolation/sample_qualifier_distinct_values.frag", stage = "frag" },
]

