# Shader manifest for dEQP-VK.tessellation.shader_input_output.*
#
# The `initPrograms` of the PatchVertexCount, PerPatchData, GLPosition, Barrier and CrossInvocation namespaces, expanded per case.
# Common shaders: `sio_attr.vert` (a float attribute forwarded to the control shader), `sio_color.frag`, `sio_glposition.frag`
# and `sio_barrier.frag`.

upstream_source = "external/vulkancts/modules/vulkan/tessellation/vktTessellationShaderInputOutputTests.cpp"
rust_module = "tessellation/shader_input_output_tests"

[[case]]
name = "patch_vertices_5_in_10_out"
rust_const = "SIO_PATCH_VERTICES_5_IN_10_OUT"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "tessellation/sio_attr.vert", stage = "vert" },
    { name = "tesc", template = "tessellation/sio_patch_vertices_5_in_10_out.tesc", stage = "tesc" },
    { name = "tese", template = "tessellation/sio_patch_vertices_5_in_10_out.tese", stage = "tese" },
    { name = "frag", template = "tessellation/sio_color.frag", stage = "frag" },
]

