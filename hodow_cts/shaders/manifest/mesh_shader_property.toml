# Shader manifest for dEQP-VK.mesh_shader.ext.properties.*
#
# The `initPrograms` of the payload and shared memory size, max view index, max output layers, max mesh output primitives and vertices,
# max mesh output components and max mesh output size cases of vktMeshShaderPropertyTestsEXT.cpp. Limits that depend on the device go
# in through specialization constants, so these sets are the fixed shader text of each case, written by tmp/gen_mesh_property.py.

upstream_source = "external/vulkancts/modules/vulkan/mesh_shader/vktMeshShaderPropertyTestsEXT.cpp"
rust_module = "mesh_shader/property_tests"
spirv_version = "spirv1.4"

[[case]]
name = "payload_shmem_task_payload"
rust_const = "PROPERTY_TASK_PAYLOAD"
rust_type = "SharedProgram"
programs = [
    { name = "task", template = "mesh_shader/property/task_payload.task", stage = "task" },
    { name = "mesh", template = "mesh_shader/property/task_payload.mesh", stage = "mesh" },
]

