# Shader manifest for dEQP-VK.mesh_shader.ext.builtin.*
#
# The `initPrograms` of every case in vktMeshShaderBuiltinTestsEXT.cpp's `builtin` group (the `pipeline` group only exists for the
# non-monolithic construction types). Everything upstream formats in (extents, task data sizes, shading rate masks) is written out, by
# tmp/gen_mesh_builtin.py. `primitive_id_spirv` pairs the same mesh shader with upstream's hand-assembled fragment shader.

upstream_source = "external/vulkancts/modules/vulkan/mesh_shader/vktMeshShaderBuiltinTestsEXT.cpp"
rust_module = "mesh_shader/builtin_tests"
spirv_version = "spirv1.4"

[[case]]
name = "position"
rust_const = "BUILTIN_POSITION"
rust_type = "SharedProgram"
programs = [
    { name = "mesh", template = "mesh_shader/builtin/position.mesh", stage = "mesh" },
    { name = "frag", template = "mesh_shader/builtin/basic.frag", stage = "frag" },
]

