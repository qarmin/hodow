# Shader manifest for dEQP-VK.pipeline.monolithic.push_descriptor.{graphics,compute}.*
#
# `initPrograms` of the push descriptor test cases, expanded per descriptor type and binding (the only things the sources depend on): the buffer
# graphics/compute cases (the buffer is `uniform`/`readonly buffer` in the graphics shader and `uniform`/`buffer` in the compute one),
# the sampler/image graphics and compute cases (`binding_next`/`binding_next2` are the descriptors after the first), the texel buffer cases,
# the input attachment cases and `PushDescriptorIncrementalUpdatesComputeTest`. Every textured graphics case shares `textured.vert`.

upstream_source = "external/vulkancts/modules/vulkan/pipeline/vktPipelinePushDescriptorTests.cpp"
rust_module = "pipeline/push_descriptor_tests"

[[case]]
name = "pd_buffer_graphics_uniform_binding0"
rust_const = "PD_BUFFER_GRAPHICS_UNIFORM_BINDING0"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "pipeline/push_descriptor/buffer_graphics.vert", stage = "vert" },
    { name = "frag", template = "pipeline/push_descriptor/buffer_graphics.frag", stage = "frag" },
]
derived = { binding = "0", binding_next = "1", buffer_type = "'uniform'" }

