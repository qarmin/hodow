n\\thighp ivec3 mA;\\n};\\nstruct sAI\\n{\\n\\thighp uvec4 mA;\\n};\\nstruct sAJ\\n{\\n\\tsAI mA;\\n\\tlowp mat2x3 mB[2];\\n};\\nstruct sAK\\n{\\n\\tsAG mA;\\n\\tsAH mB[3];\\n\\tsAJ mC;\\n};\\nstruct sAL\\n{\\n\\thighp ivec2 mA;\\n};\\nstruct sAM\\n{\\n\\tsAL mA;\\n\\tmediump vec4 mB[1];\\n};\\nstruct sAN\\n{\\n\\tsAM mA;\\n};\\nstruct S1 {\\n\\tsJ a;\\n\\tsO b;\\n\\tsP c;\\n\\tsQ d;\\n};\\nstruct S2 {\\n\\tsAA a;\\n\\tsAB b[2][3];\\n};\\nstruct S3 {\\n\\tsAE a;\\n\\tsAK b;\\n\\tsAN c;\\n};\\n\\nbool compare_float    (highp float a, highp float b)  { return abs(a - b) < 0.05; }\\nbool compare_vec2     (highp vec2 a, highp vec2 b)    { return compare_float(a.x, b.x)&&compare_float(a.y, b.y); }\\nbool compare_vec3     (highp vec3 a, highp vec3 b)    { return compare_float(a.x, b.x)&&compare_float(a.y, b.y)&&compare_float(a.z, b.z); }\\nbool compare_vec4     (highp vec4 a, highp vec4 b)    { return compare_float(a.x, b.x)&&compare_float(a.y, b.y)&&compare_float(a.z, b.z)&&compare_float(a.w, b.w); }\\nbool compare_mat2     (highp mat2 a, highp mat2 b)    { return compare_vec2(a[0], b[0])&&compare_vec2(a[1], b[1]); }\\nbool compare_mat2x3   (highp mat2x3 a, highp mat2x3 b){ return compare_vec3(a[0], b[0])&&compare_vec3(a[1], b[1]); }\\nbool compare_mat3x4   (highp mat3x4 a, highp mat3x4 b){ return compare_vec4(a[0], b[0])&&compare_vec4(a[1], b[1])&&compare_vec4(a[2], b[2]); }\\nbool compare_mat4x3   (highp mat4x3 a, highp mat4x3 b){ return compare_vec3(a[0], b[0])&&compare_vec3(a[1], b[1])&&compare_vec3(a[2], b[2])&&compare_vec3(a[3], b[3]); }\\nbool compare_int      (highp int a, highp int b)      { return a == b; }\\nbool compare_ivec2    (highp ivec2 a, highp ivec2 b)  { return a == b; }\\nbool compare_ivec3    (highp ivec3 a, highp ivec3 b)  { return a == b; }\\nbool compare_ivec4    (highp ivec4 a, highp ivec4 b)  { return a == b; }\\nbool compare_uint     (highp uint a, highp uint b)    { return a == b; }\\nbool compare_uvec2    (highp uvec2 a, highp uvec2 b)  { re