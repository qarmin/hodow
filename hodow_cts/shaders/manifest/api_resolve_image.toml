# Shader manifest for dEQP-VK.api.copy_and_blit.*.resolve_image.*
#
# The multisampled source is produced by a draw rather than an upload: a single
# triangle covering the upper-right half, cleared to blue. That is exactly what
# FILL_MODE_MULTISAMPLE builds on the host, so the reference is analytical and no
# software rasteriser is needed - only tcu::fuzzyCompare's tolerance for the edge.

upstream_source = "external/vulkancts/modules/vulkan/api/vktApiResolveTests.cpp"
rust_module = "api/resolve_image_tests"

# The `*_copy_before_resolving` options add a second render pass that reads the
# multisampled source and every layer of its copy as subpass inputs and writes a
# per-sample pass/fail flag. Upstream emits that shader per case, but it only varies in
# the number of copy attachments - one per destination layer - so it collapses to two
# variants. COPY_MS_IMAGE_LAYER_TO_MS_IMAGE also has one copy attachment; upstream
# names its local `copy` rather than `copy1`, which is the same shader.

[[case]]
name = "resolve"
rust_const = "RESOLVE_IMAGE"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "api/resolve_image.vert", stage = "vert" },
    { name = "frag", template = "api/resolve_image.frag", stage = "frag" },
]

[[case]]
name = "verify_single"
rust_const = "RESOLVE_VERIFY_SINGLE"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "api/resolve_image.vert", stage = "vert" },
    { name = "verify", template = "api/resolve_verify_single.frag", stage = "frag" },
]

[[case]]
name = "verify_array"
rust_const = "RESOLVE_VERIFY_ARRAY"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "api/resolve_image.vert", stage = "vert" },
    { name = "verify", template = "api/resolve_verify_array.frag", stage = "frag" },
]
