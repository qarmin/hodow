# Shader manifest for dEQP-VK.pipeline.monolithic.multisample.{sample_locations_ext,std_sample_locations}.verify_*
#
# `addProgramsVerifyLocationGeometry` and `addProgramsVerifyInterpolation`: a pass-through vertex shader and a fragment
# shader that checks gl_PrimitiveID or the per-sample interpolated position against the sample data SSBO.

upstream_source = "external/vulkancts/modules/vulkan/pipeline/vktPipelineMultisampleSampleLocationsExtTests.cpp"
rust_module = "pipeline/sample_locations_tests"

[[case]]
name = "verify_location"
rust_const = "SAMPLE_LOCATIONS_VERIFY_LOCATION"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "pipeline/sample_locations/position.vert", stage = "vert" },
    { name = "frag", template = "pipeline/sample_locations/verify_location.frag", stage = "frag" },
]

[[case]]
name = "verify_interpolation"
rust_const = "SAMPLE_LOCATIONS_VERIFY_INTERPOLATION"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "pipeline/sample_locations/interpolation.vert", stage = "vert" },
    { name = "frag", template = "pipeline/sample_locations/verify_interpolation.frag", stage = "frag" },
]

[[case]]
name = "draw"
rust_const = "SAMPLE_LOCATIONS_DRAW"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "pipeline/sample_locations/draw.vert", stage = "vert" },
    { name = "frag", template = "pipeline/sample_locations/draw.frag", stage = "frag" },
]
