# Shader manifest for the basic, resume, draw_outside, xfb_* built-in, holes_* and max_output_components cases of
# dEQP-VK.transform_feedback.simple.*
#
# Every one of those cases is registered with a point size of 1 (the point-size-less
# variant is illegal for point lists and skipped by addTransformFeedbackTestCaseVariants),
# so the vertex shaders carry `gl_PointSize = 1.0` literally. basic and resume share one
# shader; draw_outside writes a second one for the draw made outside transform feedback.

upstream_source = "external/vulkancts/modules/vulkan/transform_feedback/vktTransformFeedbackSimpleTests.cpp"
rust_module = "transform_feedback/simple_tests"

[[case]]
name = "basic"
rust_const = "SIMPLE_BASIC_PROGRAMS"
rust_type = "SharedProgram"
programs = [{ name = "vert", template = "transform_feedback/simple/basic.vert", stage = "vert" }]

[[case]]
name = "draw_outside"
rust_const = "SIMPLE_DRAW_OUTSIDE_PROGRAMS"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "transform_feedback/simple/draw_outside.vert", stage = "vert" },
    { name = "vert2", template = "transform_feedback/simple/draw_outside_vert2.vert", stage = "vert" },
]

# The built-in cases (xfb_pointsize, xfb_clipdistance, xfb_culldistance, xfb_clip_and_cull)
# differ per part count only in `xfb_buffer = partCount - 1`; as with the others the point
# size is always wanted, so the shaders write gl_PointSize alongside the built-in under test.

[[case]]
name = "xfb_pointsize_1"
rust_const = "SIMPLE_XFB_POINTSIZE_1_PROGRAMS"
rust_type = "SharedProgram"
programs = [{ name = "vert", template = "transform_feedback/simple/xfb_pointsize_1.vert", stage = "vert" }]

