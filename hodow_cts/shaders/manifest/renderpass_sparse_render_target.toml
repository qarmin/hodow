# Shader manifest for dEQP-VK.renderpasses.*.suballocation.sparserendertarget.*
#
# `Programs::init` of vktRenderPassSparseRenderTargetTests.cpp: one pass-through quad vertex shader and a fragment shader chosen
# by the channel class of the format. The integer ones write 1 << (bits - 1/2/3) (unsigned) or 1 << (bits - 2/3/4) (signed) per
# channel; the shift count wraps modulo 32 for a channel the format lacks, as the C++ `1u << (0u - n)` does on x86.

upstream_source = "external/vulkancts/modules/vulkan/renderpass/vktRenderPassSparseRenderTargetTests.cpp"
rust_module = "renderpass/sparse_render_target_tests"

[[case]]
name = "r5g6b5_unorm_pack16"
rust_const = "SPARSE_RT_R5G6B5_UNORM_PACK16"
rust_type = "SparseRenderTargetProgram"
programs = [
    { name = "quad-vert", template = "renderpass/sparse_render_target/quad.vert", stage = "vert" },
    { name = "quad-frag", template = "renderpass/sparse_render_target/float.frag", stage = "frag" },
]
derived = { r = "0", g = "0", b = "0" }

