# Shader manifest for dEQP-VK.image.qualifiers.{coherent,volatile}.*
#
# `initPrograms` writes one shader per (qualifier, image type, format) from the image's shader grid; the local work group
# is `min(8x8x2, grid)` per axis, which for the fixed sizes of `createImageQualifiersTests` is 8 in x, 1 (1D, buffer) or 8
# in y and 2 (2D array, 3D, cube, cube array) or 1 in z. The template does that arithmetic and the type naming from
# `kind` (the image type name), `fmt` (f, u or i: R32 float, uint, int) and `qualifier`. The `restrict` group is not
# ported: it is built by `createImageQualifierRestrictCase` in vktImageLoadStoreTests.cpp.

upstream_source = "external/vulkancts/modules/vulkan/image/vktImageQualifiersTests.cpp"
rust_module = "image/qualifiers_tests"

[[case]]
name = "coherent_1d_f"
rust_const = "QUAL_COHERENT_1D_F"
rust_type = "QualifierPrograms"
programs = [{ name = "comp", template = "image/qualifiers.comp", stage = "comp" }]
params = { qualifier = { type = "str", value = "coherent" }, kind = { type = "str", value = "1d" }, fmt = { type = "str", value = "f" } }

