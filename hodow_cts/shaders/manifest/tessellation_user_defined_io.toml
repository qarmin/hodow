# Shader manifest for dEQP-VK.tessellation.user_defined_io.*
#
# `UserDefinedIOTest::initPrograms`, expanded per case. The vertex shader forwards an attribute to the control shader and the
# fragment shader forwards the colour; both are the same in every case. The control and evaluation shaders are one pair of
# templates per IO type (what the upstream constructor builds out of `glu::VarType`s: per-patch/per-vertex variables, arrays,
# blocks and block arrays), with the size of the per-vertex input arrays (`vertex_size`: implicit, `gl_MaxPatchVertices` or the
# specification minimum 32) and the primitive type of the evaluation shader substituted per case.

upstream_source = "external/vulkancts/modules/vulkan/tessellation/vktTessellationUserDefinedIO.cpp"
rust_module = "tessellation/user_defined_io_tests"

[[case]]
name = "udio_per_patch_implicit_triangles"
rust_const = "UDIO_PER_PATCH_IMPLICIT_TRIANGLES"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "tessellation/sio_attr.vert", stage = "vert" },
    { name = "tesc", template = "tessellation/udio_per_patch.tesc", stage = "tesc" },
    { name = "tese", template = "tessellation/udio_per_patch.tese", stage = "tese" },
    { name = "frag", template = "tessellation/udio.frag", stage = "frag" },
]
derived = { vertex_size = "''", primitive = "'triangles'" }

