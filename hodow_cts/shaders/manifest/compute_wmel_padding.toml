# Shader/parameter manifest for
#   dEQP-VK.compute.pipeline.workgroup_memory_explicit_layout.padding.*  (182 cases)
#   dEQP-VK.compute.pipeline.workgroup_memory_explicit_layout.size.*     (7 cases)
#
# Upstream bakes every offset and every expected word straight into the GLSL, so each
# case really does get its own shader - unlike compute_zero_initialize.toml, where one
# shader serves a whole loop of cases. The `[[case]]` blocks below are therefore the
# expansion of the two `AddPaddingTests` loops and of the `AddSizeTests` size array,
# in upstream registration order (which is the order both binaries execute in).
#
# Only the values upstream's loops choose are written down here; everything the shader
# needs beyond that - the `layout (scalar)` prefix, the GLSL type name, the literal for
# each value and the 32 expected-word comparisons - is computed from them inside
# shaders/src/compute/wmel_padding.comp, restating `PaddingTest::CaseDef::needsScalar`
# and the `c.expected[...] = ...` lines of `AddPaddingTests`.

upstream_source = "external/vulkancts/modules/vulkan/compute/vktComputeWorkgroupMemoryExplicitLayoutTests.cpp"
rust_module = "compute/workgroup_memory_explicit_layout_padding_tests"

# `vk::SPIRV_VERSION_1_4` in both initPrograms(). Not optional: a `shared` block is
# SPV_KHR_workgroup_memory_explicit_layout, which glslang refuses to emit below 1.4.
spirv_version = "spirv1.4"

