# Shader manifest for dEQP-VK.rasterization.frag_side_effects.*
#
# `initPrograms` builds the fragment shader from a header, a statement before and a statement after the
# SSBO write, and the colour output statement placed at the beginning or at the end of main. The
# stencil_never and depth_never cases share the plain shader; depth_bounds only differs in the vertex depth.

upstream_source = "external/vulkancts/modules/vulkan/rasterization/vktRasterizationFragShaderSideEffectsTests.cpp"
rust_module = "rasterization/frag_side_effects_tests"

[[case]]
name = "kill_color_at_begin"
rust_const = "FSE_KILL_BEGIN"
rust_type = "FragSideEffectsProgram"
programs = [
    { name = "vert", template = "rasterization/frag_side_effects.vert", stage = "vert" },
    { name = "frag", template = "rasterization/frag_side_effects.frag", stage = "frag" },
]
[case.derived]
mesh_depth = "'0.0'"
headers = "''"
before = "''"
after = "'discard;'"
color_begin = "'outColor = vec4(0.0, 0.0, 1.0, 1.0);'"
color_end = "''"

[[case]]
name = "demote_color_at_begin"
rust_const = "FSE_DEMOTE_BEGIN"
rust_type = "FragSideEffectsProgram"
programs = [
    { name = "vert", template = "rasterization/frag_side_effects.vert", stage = "vert" },
    { name = "frag", template = "rasterization/frag_side_effects.frag", stage = "frag" },
]
[case.derived]
mesh_depth = "'0.0'"
headers = "'#extension GL_EXT_demote_to_helper_invocation : enable'"
before = "''"
after = "'demote;'"
color_begin = "'outColor = vec4(0.0, 0.0, 1.0, 1.0);'"
color_end = "''"

[[case]]
name = "terminate_invocation_color_at_begin"
rust_const = "FSE_TERMINATE_INVOCATION_BEGIN"
rust_type = "FragSideEffectsProgram"
programs = [
    { name = "vert", template = "rasterization/frag_side_effects.vert", stage = "vert" },
    { name = "frag", template = "rasterization/frag_side_effects.frag", stage = "frag" },
]
[case.derived]
mesh_depth = "'0.0'"
headers = "'#extension GL_EXT_terminate_invocation : enable'"
before = "''"
after = "'terminateInvocation;'"
color_begin = "'outColor = vec4(0.0, 0.0, 1.0, 1.0);'"
color_end = "''"

