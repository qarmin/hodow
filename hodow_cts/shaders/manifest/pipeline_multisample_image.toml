# Shader manifest for dEQP-VK.pipeline.monolithic.multisample.{sampled_image,3d,storage_image,standardsampleposition,samples_mapping_order}
#
# One case per (format, layer count, sample count) of the sampled and storage image groups (`sampled_<format>_l<layers>_s<samples>`,
# `storage_<format>_l<layers>_s<samples>`), per (format, sample count) of the standard sample position group
# (`position_<format>_s<samples>`), per sample count of the samples mapping order group (`mapping_order_s<samples>`), and one for the
# 3D group (`image3d`). What the upstream `initPrograms` builds out of the format (`getColorFormatStr`, `getSamplerTypeStr`,
# `getReferenceClearColorStr`, `getShaderImageFormatQualifier`, ...) is written down per format below.

