# Shader/parameter manifest for
#   dEQP-VK.compute.pipeline.builtin_var.*
#   dEQP-VK.compute.pipeline.device_group.*
#   dEQP-VK.compute.pipeline.64b_indexing.*
#
# As everywhere else, this file is the single source of truth for every per-case
# parameter: the GLSL that gets compiled and the Rust constants the test reads are
# both generated from here, so the shader and the host cannot disagree about a
# workgroup size.
#
# builtin_var is the unusual one. Upstream's ComputeBuiltinVarCase holds a list of
# SubCases (a local size + a workgroup count), and initPrograms() emits ONE shader per
# sub-case, named compute_0, compute_1, ... - the local size has to be baked into the
# shader, so a case with nine sub-cases needs nine shaders. The generator substitutes a
# single per-case environment into every template of that case, so the per-sub-case
# local size cannot come from the program entry; instead each sub-case index has its
# own template file (bvar_subcase_<i>.comp) that reads local_size_<i>. The templates
# are otherwise character-for-character identical, and all of them are
# genBuiltinVarSource() verbatim.
#
# `var_name`, `var_type_name` and `assignment` restate genBuiltinVarSource()'s
# conditional; `assignment` is the readByComponent branch, which for a uvec3 writes
# .z, .y and .x separately (the C++ switch falls through from VEC3 to VEC2).
#
# Case order follows upstream's registration order in each of the three group
# constructors, because that is the order both binaries execute in.

upstream_source = "external/vulkancts/modules/vulkan/compute/vktComputeShaderBuiltinVarTests.cpp"
rust_module = "compute/shader_builtin_var_tests"

# =================================================================================
# builtin_var - ComputeShaderBuiltinVarTests::init()
#
# The loop registers every vector-valued builtin twice, once read whole and once read
# by component; local_invocation_index is a scalar and is registered only once.
# =================================================================================

# --- NumWorkGroupsCase -----------------------------------------------------------
[[case]]
name = "num_work_groups"
rust_const = "NUM_WORK_GROUPS"
rust_type = "NumWorkGroupsCase"
programs = [
    { name = "compute_0", template = "compute/bvar_subcase_0.comp", stage = "comp" },
    { name = "compute_1", template = "compute/bvar_subcase_1.comp", stage = "comp" },
    { name = "compute_2", template = "compute/bvar_subcase_2.comp", stage = "comp" },
    { name = "compute_3", template = "compute/bvar_subcase_3.comp", stage = "comp" },
    { name = "compute_4", template = "compute/bvar_subcase_4.comp", stage = "comp" },
    { name = "compute_5", template = "compute/bvar_subcase_5.comp", stage = "comp" },
]
[case.params]
builtin = { type = "enum:BuiltinVar", value = "NumWorkGroups" }
var_type = { type = "enum:DataType", value = "UintVec3" }
read_by_component = { type = "bool", value = false }
local_size_0 = { type = "UVec3", value = [1, 1, 1] }
num_work_groups_0 = { type = "UVec3", value = [1, 1, 1] }
local_size_1 = { type = "UVec3", value = [1, 1, 1] }
num_work_groups_1 = { type = "UVec3", value = [52, 1, 1] }
local_size_2 = { type = "UVec3", value = [1, 1, 1] }
num_work_groups_2 = { type = "UVec3", value = [1, 39, 1] }
local_size_3 = { type = "UVec3", value = [1, 1, 1] }
num_work_groups_3 = { type = "UVec3", value = [1, 1, 78] }
local_size_4 = { type = "UVec3", value = [1, 1, 1] }
num_work_groups_4 = { type = "UVec3", value = [4, 7, 11] }
local_size_5 = { type = "UVec3", value = [2, 3, 4] }
num_work_groups_5 = { type = "UVec3", value = [4, 7, 11] }
[case.derived]
var_name = "'gl_NumWorkGroups'"
var_type_name = "'uint' if var_type == 'Uint' else 'uvec3'"
assignment = "('    sb_out.result[offset].z = {v}.z;\\n    sb_out.result[offset].y = {v}.y;\\n    sb_out.result[offset].x = {v}.x;\\n' if read_by_component and var_type != 'Uint' else '    sb_out.result[offset] = {v};\\n').format(v=var_name)"

