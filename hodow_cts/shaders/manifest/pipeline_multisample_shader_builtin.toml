# Shader manifest for dEQP-VK.pipeline.monolithic.multisample_shader_builtin.*
#
# `MSCase<...>::initPrograms` (every case also carries the two programs of `MSCaseBaseResolveAndPerSampleFetch::initPrograms`)
# and `WriteSampleTest::initPrograms`. The bit count shader depends on the sample count and on the shading rate
# (`bit_count_<samples>_r1` for 1.0, `_r05` for 0.5): its bounds are `minCount = 1` and `maxCount = samples - (minInvocations - 1)`
# with `minInvocations = ceil(samples * shadingRate)`.

upstream_source = "external/vulkancts/modules/vulkan/pipeline/vktPipelineMultisampleShaderBuiltInTests.cpp"
rust_module = "pipeline/multisample_shader_builtin_tests"

[[case]]
name = "sample_id"
rust_const = "BUILTIN_SAMPLE_ID"
rust_type = "SharedProgram"
programs = [ { name = "per_sample_fetch_vs", template = "pipeline/multisample_shader_builtin/per_sample_fetch.vert", stage = "vert" }, { name = "per_sample_fetch_fs", template = "pipeline/multisample_shader_builtin/per_sample_fetch.frag", stage = "frag" }, { name = "vertex_shader", template = "pipeline/multisample_shader_builtin/ndc.vert", stage = "vert" }, { name = "fragment_shader", template = "pipeline/multisample_shader_builtin/sample_id.frag", stage = "frag" } ]

