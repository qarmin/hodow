# Shader manifest for dEQP-VK.conditional_rendering.transform_feedback.*
#
# `AddProgramsDraw::init`: a pass-through vertex and fragment shader and the geometry shader that writes a different
# constant to each of four transform feedback streams, selected by a push constant. Two geometry shaders exist: the
# second also writes gl_PointSize, which a device with shaderTessellationAndGeometryPointSize needs.

upstream_source = "external/vulkancts/modules/vulkan/conditional_rendering/vktConditionalTransformFeedbackTests.cpp"
rust_module = "conditional_rendering/transform_feedback_tests"

[[case]]
name = "transform_feedback"
rust_const = "CONDITIONAL_TRANSFORM_FEEDBACK"
rust_type = "SharedProgram"
programs = [
    { name = "VertexFetch.vert", template = "conditional_rendering/xfb_vertex_fetch.vert", stage = "vert" },
    { name = "VertexFetch.geom", template = "conditional_rendering/xfb_vertex_fetch.geom", stage = "geom" },
    { name = "VertexFetchWritePoint.geom", template = "conditional_rendering/xfb_vertex_fetch_write_point.geom", stage = "geom" },
    { name = "VertexFetch.frag", template = "conditional_rendering/xfb_vertex_fetch.frag", stage = "frag" },
]
