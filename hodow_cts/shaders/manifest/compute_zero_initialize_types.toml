# Shader manifest for the types / composites / shared_memory_blocks subgroups of
# dEQP-VK.compute.pipeline.zero_initialize_workgroup_memory.*
#
# Upstream: external/vulkancts/modules/vulkan/compute/vktComputeZeroInitializeWorkgroupMemoryTests.cpp
# (AddTypeTests, AddCompositeTests, AddSharedMemoryTests). The other subgroups of the
# same upstream file live in compute_zero_initialize.toml; these three are separate
# because every one of their cases needs its own SPIR-V, so there is no shared shader
# to hang them off.
#
# Two things about the templates are worth knowing before reading them:
#
#  * `types` declares `numVariables` shared variables and writes one result per
#    variable, so its templates carry the upstream initPrograms loop as the
#    substitution expression. The manifest holds only the TypeCaseDef row it runs
#    over (typeName / typeSize / numElements / numRows / numVariables).
#  * compile_shaders.py matches `${...}` with `[^}]+`, so a substitution expression
#    cannot contain a literal `}`. The GL_EXT_null_initializer `= {}` in the types
#    templates is therefore written `{\x7d`.
#
# numVariables comes from `deRandom_getUint32(&rnd) % 16 + 1` with the generator
# seeded 0 and drawn once per case in table order, which is what upstream does; the
# draws are transcribed here so the same shader is built without a host-side RNG.

upstream_source = "external/vulkancts/modules/vulkan/compute/vktComputeZeroInitializeWorkgroupMemoryTests.cpp"
rust_module = "compute/zero_initialize_types_tests"

# --- TypeTest (AddTypeTests) ------------------------------------------------------
# 75 cases, one per TypeCaseDef row; the case name is the type name, which is what
# TypeTest::checkSupport matches against to decide which of shaderFloat16 /
# shaderFloat64 / shaderInt8 / shaderInt16 / shaderInt64 it needs.

[[case]]
name = "bool"
rust_const = "TYPES_BOOL"
rust_type = "TypeCase"
programs = [{ name = "comp", template = "compute/zi_types_scalar.comp", stage = "comp" }]
[case.params]
type_size = { type = "u32", value = 1 }
num_elements = { type = "u32", value = 1 }
num_rows = { type = "u32", value = 1 }
num_variables = { type = "u32", value = 11 }
[case.derived]
type_name = "'bool'"

