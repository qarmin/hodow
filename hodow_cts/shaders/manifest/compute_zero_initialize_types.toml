# --- CompositeTest (AddCompositeTests) --------------------------------------------
# The case name is the table index, as upstream's `de::toString(i)` produces. `index`
# is the feature-requirement bitmask CompositeTest::checkSupport reads (0x1 float16,
# 0x2 float64, 0x4 int8, 0x8 int16, 0x10 int64), not the position in the table - the
# two coincide only by accident for the first entry.
#
# `specValues` is a variable-length vector upstream. The generator has no list-of-u32
# parameter type, so it is carried as a count plus five slots; the test passes
# `spec_values[..num_spec_values]` to runCompute and the shader declares exactly
# num_spec_values spec constants.

