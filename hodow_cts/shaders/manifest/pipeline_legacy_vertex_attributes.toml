# Shader manifest for dEQP-VK.pipeline.monolithic.vertex_input.legacy_vertex_attributes.*
#
# `LegacyVertexAttributesCase::initPrograms`: the shaders depend only on the GLSL type of each binding (and on whether
# the verification buffers use the scalar layout, which is needed as soon as a vec3 is involved), so every case with
# the same list of types shares one program set. The lists below are the ones the case tree can produce: the twelve
# single types, and the three binding tuples of `populateMultipleBindingsGroup` with the shader format
# `populateMultipleBindingsFormatGroup` derives for each format.

upstream_source = "external/vulkancts/modules/vulkan/pipeline/vktPipelineLegacyAttrTests.cpp"
rust_module = "pipeline/legacy_vertex_attributes_tests"

[[case]]
name = "float"
rust_const = "LEGACY_ATTR_FLOAT"
rust_type = "LegacyAttrPrograms"
programs = [
    { name = "vert", template = "pipeline/legacy_attr.vert", stage = "vert" },
    { name = "frag", template = "pipeline/legacy_attr.frag", stage = "frag" },
]
params = { t0 = { type = "str", value = "float" }, t1 = { type = "str", value = "" }, t2 = { type = "str", value = "" }, layout = { type = "str", value = "std430" } }

