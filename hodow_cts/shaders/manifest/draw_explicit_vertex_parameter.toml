# Shader manifest for dEQP-VK.draw.*.explicit_vertex_parameter.*
#
# `DrawTestCase::initPrograms` (VK_AMD_shader_explicit_vertex_parameter): one vertex and one fragment shader per
# (sample count, interpolation, auxiliary storage qualifier). The storage buffer holds one vec4 per sample, and upstream
# sizes it as `WIDTH * HEIGHT * samples * samples`. The sample count is the decimal value of the enum, which is what
# `de::toString` puts into both the GLSL and the case name.

upstream_source = "external/vulkancts/modules/vulkan/draw/vktDrawExplicitVertexParameterTests.cpp"
rust_module = "draw/explicit_vertex_parameter_tests"

[[case]]
name = "smooth_none_samples_1"
rust_const = "EXPLICIT_VERTEX_PARAMETER_SMOOTH_NONE_SAMPLES_1"
rust_type = "ExplicitVertexParameterPrograms"
programs = [
    { name = "vert", template = "draw/explicit_vertex_parameter.vert", stage = "vert" },
    { name = "frag", template = "draw/explicit_vertex_parameter.frag", stage = "frag" },
]
params = { samples = { type = "u32", value = 1 }, qualifier = { type = "str", value = "smooth" }, auxqualifier = { type = "str", value = "" }, barycoord = { type = "str", value = "gl_BaryCoordSmoothAMD" } }
[case.derived]
numValues = "256 * samples * samples"

