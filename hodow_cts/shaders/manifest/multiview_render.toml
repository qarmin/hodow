# Shader manifest for dEQP-VK.multiview.*
#
# `MultiViewRenderTestsCase::initPrograms`: the program set depends only on the test type, so there is one case per type. The
# shaders that read gl_ViewIndex and the ones that pass the colour through are told apart by the vertex and fragment names.

upstream_source = "external/vulkancts/modules/vulkan/multiview/vktMultiViewRenderTests.cpp"
rust_module = "multiview/render_tests"

[[case]]
name = "mv_masks"
rust_const = "MV_MASKS"
rust_type = "SharedProgram"
programs = [
    { name = "vertex", template = "multiview/vert_plain.vert", stage = "vert" },
    { name = "fragment", template = "multiview/frag_plain.frag", stage = "frag" },
]

[[case]]
name = "mv_view_index_in_vertex"
rust_const = "MV_VIEW_INDEX_IN_VERTEX"
rust_type = "SharedProgram"
programs = [
    { name = "vertex", template = "multiview/vert_color.vert", stage = "vert" },
    { name = "fragment", template = "multiview/frag_plain.frag", stage = "frag" },
]

