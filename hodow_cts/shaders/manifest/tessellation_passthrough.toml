    { name = "tesc", template = "tessellation/passthrough_tessellation_isolines.tesc", stage = "tesc" },
    { name = "tese", template = "tessellation/passthrough_tessellation_isolines.tese", stage = "tese" },
    { name = "geom_from_tese", template = "tessellation/passthrough_tessellation_isolines_from_tese.geom", stage = "geom" },
