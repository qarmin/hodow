# Shader manifest for dEQP-VK.pipeline.monolithic.no_position.*
#
# `NoPositionCase::initPrograms`, pre-expanded by a shell loop over its parameters: `explicit` declares the gl_PerVertex
# blocks, `ssbo` makes every selected stage count its invocations, `views` is the number of views (more than one adds
# GL_EXT_multiview and makes the counters per view). `stages` and `writes` are bit masks over vertex (1), tessellation
# control (2), tessellation evaluation (4) and geometry (8): the stages present and the subset that write gl_Position.
# The device-group variant (`device_index_as_view_index`) is not ported.

upstream_source = "external/vulkancts/modules/vulkan/pipeline/vktPipelineNoPositionTests.cpp"
rust_module = "pipeline/no_position_tests"

