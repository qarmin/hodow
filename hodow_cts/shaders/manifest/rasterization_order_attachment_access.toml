# Shader manifest for dEQP-VK.rasterization.rasterization_order_attachment_access.*
#
# One case per (kind, format, attachment count, sample count, overlap) that changes a shader: `d` is overlapping draws
# only (multi_draw_barriers and multi_draw share it, they differ in the synchronisation), `p` overlapping primitives, `i`
# overlapping instances and `dpi` all three. The `${...}` names are upstream's `StringTemplate` parameters of
# `AttachmentAccessOrderTestCase::initPrograms`. The case list and the templates in shaders/src/rasterization/order_attachment_access/
# were written by a shell loop, not by hand; `rust_const` and the case name encode the same key the test builds.

upstream_source = "external/vulkancts/modules/vulkan/rasterization/vktRasterizationOrderAttachmentAccessTests.cpp"
rust_module = "rasterization/order_attachment_access_tests"

[[case]]
name = "color_float_att1_s1_d"
rust_const = "OAA_COLOR_FLOAT_ATT1_S1_D"
rust_type = "OrderAccessProgram"
programs = [
    { name = "vert1", template = "rasterization/order_attachment_access/simple.vert", stage = "vert" },
    { name = "vert2", template = "rasterization/order_attachment_access/simple.vert", stage = "vert" },
    { name = "frag", template = "rasterization/order_attachment_access/color_frag_1_0.frag", stage = "frag" },
    { name = "frag_resolve", template = "rasterization/order_attachment_access/color_resolve_1_0.frag", stage = "frag" },
]
[case.derived]
PRIMITIVE_NUM = "'1'"
INSTANCE_NUM = "'1'"
DRAW_NUM = "'6'"
ATT_NUM = "'1'"
SAMPLE_NUM = "'1'"
SUBPASS_INPUT = "'subpassInput'"
SCALAR_NAME = "'float'"
VEC_NAME = "'vec'"

