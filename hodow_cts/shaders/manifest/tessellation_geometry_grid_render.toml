    { name = "vert", template = "tessellation/grid_render.vert", stage = "vert" },
    { name = "frag", template = "tessellation/grid_render.frag", stage = "frag" },
    { name = "tesc", template = "tessellation/grid_render_level5.tesc", stage = "tesc" },
    { name = "tese", template = "tessellation/grid_render_fill_level5.tese", stage = "tese" },
    { name = "geom", template = "tessellation/grid_render_max_geometry.geom", stage = "geom" },
]

