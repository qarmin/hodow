# Shader manifest for dEQP-VK.mesh_shader.ext.in_out.*
#
# `InterfaceVariablesCase::initPrograms`: the interface variables passed between task, mesh and fragment shaders come from a pseudorandom
# permutation of the variables each requirement group allows (40 per group, seeded as upstream does), cut to 16 locations. Upstream
# formats the GLSL from that list at run time; here every (group, permutation, task) combination is its own pre-expanded set.

upstream_source = "external/vulkancts/modules/vulkan/mesh_shader/vktMeshShaderInOutTestsEXT.cpp"
rust_module = "mesh_shader/in_out_tests"
spirv_version = "spirv1.4"

[[case]]
name = "r0_p0_mesh"
rust_const = "IN_OUT_R0_P0_MESH"
rust_type = "SharedProgram"
programs = [
    { name = "mesh", template = "mesh_shader/in_out/mesh_r0_p0_mesh.mesh", stage = "mesh" },
    { name = "frag", template = "mesh_shader/in_out/frag_r0_p0.frag", stage = "frag" },
]

[[case]]
name = "r0_p0_task"
rust_const = "IN_OUT_R0_P0_TASK"
rust_type = "SharedProgram"
programs = [
    { name = "task", template = "mesh_shader/in_out/task_r0_p0.task", stage = "task" },
    { name = "mesh", template = "mesh_shader/in_out/mesh_r0_p0_task.mesh", stage = "mesh" },
    { name = "frag", template = "mesh_shader/in_out/frag_r0_p0.frag", stage = "frag" },
]

