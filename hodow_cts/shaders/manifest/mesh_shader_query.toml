# Shader manifest for dEQP-VK.mesh_shader.ext.query.*
#
# `MeshQueryCase::initPrograms`: the fragment shader depends on multiview, the mesh shader on the geometry type, whether a task
# shader is used and the image height (which follows the draw blocks), and the task shader on the pseudorandomly shuffled mesh
# task counts (a 2 in one of three positions). Every combination of the five is its own set.

upstream_source = "external/vulkancts/modules/vulkan/mesh_shader/vktMeshShaderQueryTestsEXT.cpp"
rust_module = "mesh_shader/query_tests"
spirv_version = "spirv1.4"

[[case]]
name = "points_notask_h0_mv0"
rust_const = "QUERY_POINTS_NOTASK_H0_MV0"
rust_type = "SharedProgram"
programs = [
    { name = "mesh", template = "mesh_shader/query/points_notask_h0.mesh", stage = "mesh" },
    { name = "frag", template = "mesh_shader/query/query.frag", stage = "frag" },
]

