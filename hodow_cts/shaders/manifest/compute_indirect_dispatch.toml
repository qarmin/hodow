# Shader manifest for dEQP-VK.compute.pipeline.indirect_dispatch.*
#
# The dispatch command list lives here rather than in the Rust because it is needed in
# two places at once: the `gen_in_compute` shader writes those commands, and the host
# checks the results against them. Keeping one copy is the point of the manifest.
#
# `group_check` reproduces the conditional upstream emits only for non-null dispatches;
# `write_cmds` reproduces the writeCmd() lines its generate shader emits. Offsets are
# byte offsets, divided by 4 for the uint-indexed shader, exactly as upstream does.

upstream_source = "external/vulkancts/modules/vulkan/compute/vktComputeIndirectComputeDispatchTests.cpp"
rust_module = "compute/indirect_compute_dispatch_tests"

[[case]]
name = "single_invocation"
rust_const = "SINGLE_INVOCATION"
rust_type = "IndirectDispatchCase"
programs = [
    { name = "comp", template = "compute/indirect_dispatch_verify.comp", stage = "comp" },
    { name = "generate", template = "compute/indirect_dispatch_generate.comp", stage = "comp" },
]
[case.params]
buffer_size = { type = "u32", value = 12 }
local_size = { type = "IVec3", value = [1, 1, 1] }
null_dispatch = { type = "bool", value = false }
dispatch_commands = { type = "DispatchCommands", value = [[0, 1, 1, 1]] }
[case.derived]
group_check = "'' if null_dispatch else '    if (all(equal(result.expectedGroupCount, gl_NumWorkGroups)))\\n'"
write_cmds = "''.join('\\twriteCmd({}u, uvec3({}u, {}u, {}u));\\n'.format(c[0]//4, c[1], c[2], c[3]) for c in dispatch_commands)"

