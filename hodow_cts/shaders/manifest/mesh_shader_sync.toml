# Shader manifest for dEQP-VK.mesh_shader.ext.synchronization.*
#
# `MeshShaderSyncCase::initPrograms`: the task, mesh and fragment shaders that read or write the resource depend on the case (resource
# type, write access and test value), next to fixed passthrough shaders. Upstream formats them at run time; each case is pre-expanded
# here and found by its test value. `BarrierAcrossSecondaryCase` has its own fixed compute, task and mesh set.

upstream_source = "external/vulkancts/modules/vulkan/mesh_shader/vktMeshShaderSyncTestsEXT.cpp"
rust_module = "mesh_shader/sync_tests"
spirv_version = "spirv1.4"

[[case]]
name = "v1628510124"
rust_const = "SYNC_V1628510124"
rust_type = "SharedProgram"
programs = [
    { name = "task", template = "mesh_shader/sync/task_v1628510124.task", stage = "task" },
    { name = "mesh", template = "mesh_shader/sync/mesh_v1628510124.mesh", stage = "mesh" },
    { name = "frag", template = "mesh_shader/sync/frag_v1628510124.frag", stage = "frag" },
    { name = "taskPassthrough", template = "mesh_shader/sync/pass.task", stage = "task" },
    { name = "fragPassthrough", template = "mesh_shader/sync/pass.frag", stage = "frag" },
    { name = "meshPassthrough", template = "mesh_shader/sync/pass.mesh", stage = "mesh" },
