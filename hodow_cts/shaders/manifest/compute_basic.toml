[case.params]
num_values = { type = "u32", value = 1024 }
sized = { type = "bool", value = true }
local_size = { type = "IVec3", value = [1, 4, 2] }
work_size = { type = "IVec3", value = [2, 2, 4] }
[case.derived]
array_len = "num_values if sized else ''"

[[case]]
name = "ssbo_unsized_arr_single_invocation"
rust_const = "SSBO_UNSIZED_ARR_SINGLE_INVOCATION"
