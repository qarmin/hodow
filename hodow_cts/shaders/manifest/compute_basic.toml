rust_const = "EMPTY_WORKGROUP_Z"
rust_type = "EmptyWorkGroupCase"
programs = [{ name = "comp", template = "compute/empty_workgroup.comp", stage = "comp" }]
[case.params]
dispatch_size = { type = "UVec3", value = [2, 3, 0] }

[[case]]
name = "empty_workgroup_all"
rust_const = "EMPTY_WORKGROUP_ALL"
rust_type = "EmptyWorkGroupCase"
programs = [{ name = "comp", template = "compute/empty_workgroup.comp", stage = "comp" }]
[case.params]
dispatch_size = { type = "UVec3", value = [0, 0, 0] }

# --- MaxWorkGroupSizeTest --------------------------------------------------------
