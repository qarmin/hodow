# --- InvertSSBOInPlaceTest -------------------------------------------------------
# `sized` picks between a fixed-length and a runtime-length array declaration; the
# unsized variants are what exercise the driver's `.length()` handling.
[[case]]
name = "ssbo_rw_single_invocation"
rust_const = "SSBO_RW_SINGLE_INVOCATION"
rust_type = "InvertSsboInPlaceCase"
programs = [{ name = "comp", template = "compute/invert_ssbo_in_place.comp", stage = "comp" }]
[case.params]
num_values = { type = "u32", value = 256 }
sized = { type = "bool", value = true }
local_size = { type = "IVec3", value = [1, 1, 1] }
work_size = { type = "IVec3", value = [1, 1, 1] }
[case.derived]
array_len = "num_values if sized else ''"

[[case]]
name = "ssbo_rw_multiple_groups"
rust_const = "SSBO_RW_MULTIPLE_GROUPS"
rust_type = "InvertSsboInPlaceCase"
