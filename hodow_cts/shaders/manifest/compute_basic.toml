# Shader/parameter manifest for dEQP-VK.compute.pipeline.basic.*
#
# This file is the single source of truth for every per-case parameter. The GLSL that
# gets compiled and the Rust constants the test code reads are BOTH generated from
# here by scripts/compile_shaders.py, so the shader and the host can never disagree
# about a workgroup size or an array length.
#
# `derived` entries restate the formulas from the upstream initPrograms() verbatim so
# a reader can check them against the C++ side by side. Available helpers: prod(v)
# (multiplyComponents), and any parameter or earlier derived value by name.
#
# Case order follows the upstream createBasicComputeShaderTests() registration order,
# because that is the order both binaries execute in and it makes a diff of the two
# result files readable.

upstream_source = "external/vulkancts/modules/vulkan/compute/vktComputeBasicComputeShaderTests.cpp"
rust_module = "compute/basic_compute_shader_tests"

# --- EmptyShaderTest -------------------------------------------------------------
[[case]]
name = "empty_shader"
rust_const = "EMPTY_SHADER"
rust_type = "EmptyShaderCase"
programs = [{ name = "comp", template = "compute/empty_shader.comp", stage = "comp" }]

# --- EmptyWorkGroupCase ----------------------------------------------------------
# One dispatch dimension is zero, so the first dispatch must do nothing at all; a
# second 1x1x1 dispatch then writes the 1 that is checked for.
[[case]]
name = "empty_workgroup_x"
rust_const = "EMPTY_WORKGROUP_X"
rust_type = "EmptyWorkGroupCase"
programs = [{ name = "comp", template = "compute/empty_workgroup.comp", stage = "comp" }]
[case.params]
dispatch_size = { type = "UVec3", value = [0, 2, 3] }

[[case]]
name = "empty_workgroup_y"
rust_const = "EMPTY_WORKGROUP_Y"
rust_type = "EmptyWorkGroupCase"
programs = [{ name = "comp", template = "compute/empty_workgroup.comp", stage = "comp" }]
[case.params]
dispatch_size = { type = "UVec3", value = [2, 0, 3] }

[[case]]
