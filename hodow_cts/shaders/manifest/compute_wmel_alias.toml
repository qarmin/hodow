# Shader/parameter manifest for dEQP-VK.compute.pipeline.workgroup_memory_explicit_layout.alias.*
#
# @generated - expanded from the upstream AddAliasTests() case table
# (external/vulkancts/modules/vulkan/compute/vktComputeWorkgroupMemoryExplicitLayoutTests.cpp).
# Regenerate by re-expanding that table, not by hand-editing single entries.
#
# Upstream builds one CaseDef per (type pair x layout set x requirement set) with the
# CASE / CASE_WITH_REVERSE macros, then multiplies it by 4 `Function` variants and 2
# `Synchronization` variants. Every one of those axes changes the emitted GLSL - the
# layout qualifier, whether the read/write happens through a function, and whether a
# `barrier()` sits between them - so unlike compute_zero_initialize.toml none of them
# can collapse into a run-time parameter and each case needs its own entry here. The
# eight (function, synchronization) *shapes* do collapse: they are the eight
# `shaders/src/compute/wmel_alias*.comp` templates, and the per-case strings below are
# substituted into them.
#
# `requirements` is AliasTest::Requirements as a bitmask, matching the C++:
#   1 = Float16, 2 = Float64, 4 = Int8, 8 = Int16, 16 = Int64.
# `layout` is the single AliasTest::LayoutFlags bit this case was expanded for;
# `check_support` uses it for the `needsScalar` decision, exactly as upstream does.

upstream_source = "external/vulkancts/modules/vulkan/compute/vktComputeWorkgroupMemoryExplicitLayoutTests.cpp"
# GL_EXT_shared_memory_block is the SPIR-V WorkgroupMemoryExplicitLayoutKHR
# capability, which glslang only emits at SPIR-V 1.4 or higher. Upstream builds this
# file with vk::SPIRV_VERSION_1_4. Set per manifest, not globally: raising the floor
# for the other groups would silently change SPIR-V that is already generated.
spirv_version = "spirv1.4"
rust_module = "compute/workgroup_memory_explicit_layout_alias_tests"


