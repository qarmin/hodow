# Shader manifest for dEQP-VK.mesh_shader.ext.smoke.monolithic.*
#
# The `initPrograms` of `MeshOnlyTriangleCase`, `MeshTaskTriangleCase`, `TaskOnlyTriangleCase`, `initGradientPrograms`,
# `PartialUsageCase` and `depthOnlyPrograms` in vktMeshShaderSmokeTestsEXT.cpp, with the values upstream formats in written out.

upstream_source = "external/vulkancts/modules/vulkan/mesh_shader/vktMeshShaderSmokeTestsEXT.cpp"
rust_module = "mesh_shader/smoke_tests"
spirv_version = "spirv1.4"

[[case]]
name = "mesh_only"
rust_const = "SMOKE_MESH_ONLY"
rust_type = "SharedProgram"
programs = [
    { name = "mesh", template = "mesh_shader/smoke/triangle_mesh_only.mesh", stage = "mesh" },
    { name = "frag", template = "mesh_shader/smoke/mesh_frag.frag", stage = "frag" },
]

[[case]]
name = "mesh_task"
rust_const = "SMOKE_MESH_TASK"
rust_type = "SharedProgram"
programs = [
    { name = "task", template = "mesh_shader/smoke/triangle_mesh_task.task", stage = "task" },
    { name = "mesh", template = "mesh_shader/smoke/triangle_mesh_task.mesh", stage = "mesh" },
    { name = "frag", template = "mesh_shader/smoke/mesh_frag.frag", stage = "frag" },
]

[[case]]
name = "task_only"
rust_const = "SMOKE_TASK_ONLY"
rust_type = "SharedProgram"
programs = [
    { name = "task", template = "mesh_shader/smoke/task_only.task", stage = "task" },
    { name = "mesh", template = "mesh_shader/smoke/triangle_mesh_only.mesh", stage = "mesh" },
    { name = "frag", template = "mesh_shader/smoke/mesh_frag.frag", stage = "frag" },
]

[[case]]
name = "gradient"
rust_const = "SMOKE_GRADIENT"
rust_type = "SharedProgram"
programs = [
    { name = "frag", template = "mesh_shader/smoke/gradient.frag", stage = "frag" },
    { name = "mesh", template = "mesh_shader/smoke/gradient.mesh", stage = "mesh" },
]

