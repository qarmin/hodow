# Shader manifest for dEQP-VK.mesh_shader.ext.misc.*
#
# The `initPrograms` of the families of vktMeshShaderMiscTestsEXT.cpp ported so far. Every value upstream formats into its GLSL is written
# out, by tmp/gen_mesh_misc.py; the generic fragment shader is shared by all of them.

upstream_source = "external/vulkancts/modules/vulkan/mesh_shader/vktMeshShaderMiscTestsEXT.cpp"
rust_module = "mesh_shader/misc_tests"
spirv_version = "spirv1.4"

[[case]]
name = "complex_task_data"
rust_const = "MISC_COMPLEX_TASK_DATA"
rust_type = "SharedProgram"
programs = [
    { name = "task", template = "mesh_shader/misc/complex_task_data.task", stage = "task" },
    { name = "mesh", template = "mesh_shader/misc/complex_task_data.mesh", stage = "mesh" },
    { name = "frag", template = "mesh_shader/misc/generic.frag", stage = "frag" },
]

