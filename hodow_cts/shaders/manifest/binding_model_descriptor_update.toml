rust_const = "SAMPLERLESS_INPUT_ATTACHMENT_SET0"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "binding_model/descriptor_update/samplerless_vert.vert", stage = "vert" },
    { name = "frag", template = "binding_model/descriptor_update/samplerless_input_attachment_set0.frag", stage = "frag" },
