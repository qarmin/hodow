  { name = "geom", template = "geometry/layered_single_layer.geom", stage = "geom" },
  { name = "frag", template = "geometry/layered_white.frag", stage = "frag" },
]
params = { test_type = { type = "str", value = "single" }, num_layers = { type = "u32", value = 0 }, target_layer = { type = "u32", value = 2 }, view = { type = "str", value = "none" } }

