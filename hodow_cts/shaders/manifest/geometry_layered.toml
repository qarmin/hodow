# Shader manifest for dEQP-VK.geometry.layered.*
#
# `initPrograms` builds the geometry shader from the test type and the number of layers (the depth for a 3D image), and the
# fragment shader from the test type (and, for the secondary command buffer case, the storage image's view type). The
# number of layers is 4, 6, 8 or 12 over the ten image configurations and `render_to_one` draws to layer 2, 3, 4 or 6, so
# the cases are the distinct combinations. `test_type` is one of default, single, all, different, layer_id, invocation,
# multiple, readback and secondary; `target_layer` only matters to single, `num_layers` to every other type but default,
# and `view` to secondary (`none` elsewhere). The secondary case draws like `all`: its geometry shader is the same.

upstream_source = "external/vulkancts/modules/vulkan/geometry/vktGeometryLayeredRenderingTests.cpp"
rust_module = "geometry/layered_tests"

[[case]]
name = "default"
rust_const = "LAYERED_DEFAULT"
rust_type = "LayeredPrograms"
programs = [
  { name = "vert", template = "geometry/layered.vert", stage = "vert" },
  { name = "geom", template = "geometry/layered_default_layer.geom", stage = "geom" },
  { name = "frag", template = "geometry/layered_white.frag", stage = "frag" },
]
params = { test_type = { type = "str", value = "default" }, num_layers = { type = "u32", value = 0 }, target_layer = { type = "u32", value = 0 }, view = { type = "str", value = "none" } }

[[case]]
name = "single_t2"
rust_const = "LAYERED_SINGLE_2"
rust_type = "LayeredPrograms"
