# Shader manifest for dEQP-VK.image.depth_stencil_descriptor.*
#
# `DepthStencilDescriptorCase::initPrograms` writes the descriptors of the read-only accesses (input attachments and
# sampled images, depth first and then stencil, bindings in that order) into the source, so the source depends only on the
# list of descriptor kinds per aspect and on compute vs graphics. Each kind list is `n` (none), `ia`, `s` or `ia_s`.

upstream_source = "external/vulkancts/modules/vulkan/image/vktImageDepthStencilDescriptorTests.cpp"
rust_module = "image/depth_stencil_descriptor_tests"

[[case]]
name = "g_n_n"
rust_const = "DSD_G_N_N"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "image/depth_stencil_descriptor/pass_through.vert", stage = "vert" },
    { name = "frag", template = "image/depth_stencil_descriptor/frag_n_n.frag", stage = "frag" },
]

[[case]]
name = "g_n_ia"
rust_const = "DSD_G_N_IA"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "image/depth_stencil_descriptor/pass_through.vert", stage = "vert" },
    { name = "frag", template = "image/depth_stencil_descriptor/frag_n_ia.frag", stage = "frag" },
]

