    { name = "frag_smooth", template = "draw/multiple_interpolation/sep_sample_smooth.frag", stage = "frag" },
    { name = "vert_flat", template = "draw/multiple_interpolation/sep_sample_flat.vert", stage = "vert" },
    { name = "frag_flat", template = "draw/multiple_interpolation/sep_sample_flat.frag", stage = "frag" },
    { name = "vert_noperspective", template = "draw/multiple_interpolation/sep_sample_noperspective.vert", stage = "vert" },
    { name = "frag_noperspective", template = "draw/multiple_interpolation/sep_sample_noperspective.frag", stage = "frag" },
    { name = "vert_centroid", template = "draw/multiple_interpolation/sep_sample_centroid.vert", stage = "vert" },
    { name = "frag_centroid", template = "draw/multiple_interpolation/sep_sample_centroid.frag", stage = "frag" },
