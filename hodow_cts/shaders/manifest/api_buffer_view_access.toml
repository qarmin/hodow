# Shader manifest for dEQP-VK.api.buffer_view.access.* (the all-formats cases).
#
# One compute shader, sixteen variants. The GLSL differs only in four tokens - the
# sampler type, the storage-image layout qualifier, the fetch function and the scalar
# prefix - so those are the manifest's parameters, and they are emitted into the Rust as
# well. The host picks its program by matching the qualifier it computes for the format
# it is about to bind, so a manifest entry that does not describe a real format cannot
# be reached by accident.
#
# The uniform variants have no layout qualifier and so are shared by every format of
# their scalar class; the storage ones need the qualifier and are shared by the formats
# that map to it.

upstream_source = "external/vulkancts/modules/vulkan/api/vktApiBufferViewAccessTests.cpp"
rust_module = "api/buffer_view_access_tests"

# --- uniform texel buffers: texelFetch on a textureBuffer ---------------------------
[[case]]
name = "uniform_float"
rust_const = "BV_UNIFORM_FLOAT"
rust_type = "BufferViewAccessProgram"
programs = [{ name = "comp", template = "api/buffer_view_access.comp", stage = "comp" }]
[case.params]
storage_type = { type = "str", value = "textureBuffer " }
extra_option = { type = "str", value = "" }
fmt_layout = { type = "str", value = "" }
op_name = { type = "str", value = "texelFetch" }
in_format = { type = "str", value = "" }
out_format = { type = "str", value = "" }

