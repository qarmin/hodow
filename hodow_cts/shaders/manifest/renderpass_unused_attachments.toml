# Shader manifest for dEQP-VK.renderpasses.dynamic_rendering.*.unused_attachments.*
#
# `DynamicUnusedAttachmentsCase::initPrograms`: a vertex shader that writes gl_Layer only when the test renders several layers without
# multiview (built twice, as SPIR-V 1.0 and 1.5, for Vulkan before and after 1.2), and a fragment shader that declares an output only for
# the colour attachments whose pipeline format is not VK_FORMAT_UNDEFINED. So a program set is keyed by the fragment output count, the
# mask of outputs that are written, how the layer is chosen (mv = gl_ViewIndex, layer = gl_Layer, plain = 0) and whether four extra
# `vec4` outputs follow (`largeRenderAttCount`). The fragment files were written out by a shell loop over the test matrix of
# `createDynamicRenderingUnusedAttachmentsTests`, so the set is exactly what that matrix needs.

upstream_source = "external/vulkancts/modules/vulkan/renderpass/vktDynamicRenderingUnusedAttachmentsTests.cpp"
rust_module = "renderpass/unused_attachments_tests"

[[case]]
name = "f1_u01_plain"
rust_const = "UNUSED_ATT_F1_U01_PLAIN"
rust_type = "UnusedAttachmentsPrograms"
programs = [
    { name = "vert-spv10", template = "renderpass/unused_attachments/vert_nolayer.vert", stage = "vert" },
    { name = "vert-spv15", template = "renderpass/unused_attachments/vert_nolayer.vert", stage = "vert", spirv_version = "spirv1.5" },
    { name = "frag", template = "renderpass/unused_attachments/frag_f1_u01_plain.frag", stage = "frag" },
]
params = { frag_att = { type = "u32", value = 1 }, used_mask = { type = "u32", value = 1 }, mode = { type = "str", value = "plain" }, large_render = { type = "bool", value = false } }

