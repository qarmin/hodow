# Shader manifest for dEQP-VK.shader_object.{create,binary}.*
#
# `addBasicShaderObjectShaders` (binary: query and incompatible) and the two initPrograms of the create tests: the `multiple` group builds one
# shader per stage (plus mesh and task for `all_with_mesh`), and every `create.<stage>.*` case builds ten variants of each stage whose only
# difference is a constant, named `<stage><0..9>`.

upstream_source = "external/vulkancts/modules/vulkan/shader_object/vktShaderObjectCreateTests.cpp"
rust_module = "shader_object/create_tests"

[[case]]
name = "basic"
rust_const = "SHADER_OBJECT_BASIC"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "shader_object/basic.vert", stage = "vert" },
    { name = "tesc", template = "shader_object/basic.tesc", stage = "tesc" },
    { name = "tese", template = "shader_object/basic.tese", stage = "tese" },
    { name = "geom", template = "shader_object/basic.geom", stage = "geom" },
    { name = "frag", template = "shader_object/basic.frag", stage = "frag" },
    { name = "comp", template = "shader_object/basic.comp", stage = "comp" },
]

[[case]]
name = "create_all"
rust_const = "SHADER_OBJECT_CREATE_ALL"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "shader_object/create.vert", stage = "vert" },
    { name = "tesc", template = "shader_object/create.tesc", stage = "tesc" },
    { name = "tese", template = "shader_object/create.tese", stage = "tese" },
    { name = "geom", template = "shader_object/create.geom", stage = "geom" },
    { name = "frag", template = "shader_object/create.frag", stage = "frag" },
    { name = "comp", template = "shader_object/create.comp", stage = "comp" },
]

