# Shader manifest for dEQP-VK.pipeline.monolithic.push_constant.*
#
# initPrograms of vktPipelinePushConstantTests.cpp. The graphics_pipeline cases (PushConstantGraphicsDisjointTest and
# PushConstantGraphicsOverlapTest) generate their GLSL from the case parameters (ranges, stage using them, index type), so each case has
# its own set of files under shaders/src/pipeline/push_constant/graphics/, one per stage the case's ranges name, written out
# for every case. The `_command2` variants of a case use the same programs.

upstream_source = "external/vulkancts/modules/vulkan/pipeline/vktPipelinePushConstantTests.cpp"
rust_module = "pipeline/push_constant_tests"

[[case]]
name = "compute"
rust_const = "PC_COMPUTE"
rust_type = "SharedProgram"
programs = [
    { name = "compute", template = "pipeline/push_constant/compute.comp", stage = "comp" },
]

[[case]]
name = "overwrite_compute"
rust_const = "PC_OVERWRITE_COMPUTE"
rust_type = "SharedProgram"
programs = [
    { name = "comp", template = "pipeline/push_constant/overwrite.comp", stage = "comp" },
]

[[case]]
name = "overwrite_graphics"
rust_const = "PC_OVERWRITE_GRAPHICS"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "pipeline/push_constant/overwrite.vert", stage = "vert" },
    { name = "frag", template = "pipeline/push_constant/overwrite.frag", stage = "frag" },
]

[[case]]
name = "lifetime"
rust_const = "PC_LIFETIME"
rust_type = "SharedProgram"
programs = [
    { name = "color_vert_lt", template = "pipeline/push_constant/lifetime.vert", stage = "vert" },
    { name = "color_frag_lt", template = "pipeline/push_constant/lifetime.frag", stage = "frag" },
    { name = "compute_lt", template = "pipeline/push_constant/lifetime.comp", stage = "comp" },
]

