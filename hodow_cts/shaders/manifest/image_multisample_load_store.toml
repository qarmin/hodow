# Shader manifest for dEQP-VK.image.load_store_multisample.*
#
# `initPrograms` of vktImageMultisampleLoadStoreTests.cpp (comp_store and comp_load), pre-expanded over what the shaders depend on:
# the way the texture is bound (kind: 2d, 2d_array, 2d_array_single for a view per layer), the format and the sample count. The
# colour expressions are the upstream ones for a 32x32 image: scale 1/31 for UNORM, 2/31 and bias -1 for SNORM, the A8_UNORM
# format switching its alpha and red values and expecting RGB (0, 0, 0).

upstream_source = "external/vulkancts/modules/vulkan/image/vktImageMultisampleLoadStoreTests.cpp"
rust_module = "image/multisample_load_store_tests"

[[case]]
name = "k2d_r32g32b32a32_sfloat_s2"
rust_const = "MS_K2D_R32G32B32A32_SFLOAT_S2"
rust_type = "MultisampleProgram"
programs = [
    { name = "comp_store", template = "image/multisample_load_store/store.comp", stage = "comp" },
    { name = "comp_load", template = "image/multisample_load_store/load_approx.comp", stage = "comp" },
]
params = { kind = { type = "str", value = "2d" }, format = { type = "str", value = "r32g32b32a32_sfloat" }, samples = { type = "u32", value = 2 } }
derived = { ext = "''", fq = "', rgba32f'", ms_type = "'image2DMS'", cs_type = "'iimage2D'", texel = "'ivec2(gx, gy)'", color = "'vec4(gx^gy^gz^(sampleNdx >> 5)^(sampleNdx & 31), (31-gx)^gy^gz, gx^(31-gy)^gz, (31-gx)^(31-gy)^gz)'", expected = "'vec4(gx^gy^gz^(sampleNdx >> 5)^(sampleNdx & 31), (31-gx)^gy^gz, gx^(31-gy)^gz, (31-gx)^(31-gy)^gz)'", gvec4 = "'vec4'" }

