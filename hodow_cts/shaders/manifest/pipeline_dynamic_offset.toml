# Shader manifest for dEQP-VK.pipeline.monolithic.dynamic_offset.{graphics,compute}.*
#
# `DynamicOffsetGraphicsTest::initPrograms` and `DynamicOffsetComputeTest::initPrograms`, one program set per value of what
# the sources depend on: the grouping of the descriptors (one set, one set per binding, arrays), the descriptor type
# (uniform or storage buffer), and the number of dynamic and non-dynamic bindings. The graphics vertex shader adds the
# colours of every binding into its output colour; the compute shader adds them into a storage buffer.

upstream_source = "external/vulkancts/modules/vulkan/pipeline/vktPipelineDynamicOffsetTests.cpp"
rust_module = "pipeline/dynamic_offset_tests"

[[case]]
name = "gfx_single_set_uniform_buffer_d1_n0"
rust_const = "DYNAMIC_OFFSET_GFX_SINGLE_SET_UNIFORM_BUFFER_D1_N0"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "pipeline/dynamic_offset/gfx_single_set_uniform_buffer_d1_n0.vert", stage = "vert" },
    { name = "frag", template = "pipeline/dynamic_offset/gfx_passthrough.frag", stage = "frag" },
]

