# Shader manifest for dEQP-VK.robustness.vertex_access.*
#
# `VertexAccessTest::initPrograms`: the vertex shader copies every attribute channel of three identical attributes into a
# storage buffer, so its source depends on the format class and channel count, the number of vertices and instances drawn.
# The indexed cases all draw six vertices and one instance, so they share one program per format.

upstream_source = "external/vulkancts/modules/vulkan/robustness/vktRobustnessVertexAccessTests.cpp"
rust_module = "robustness/vertex_access_tests"

[[case]]
name = "r32_uint_vertex_out_of_bounds"
rust_const = "VA_R32_UINT_VERTEX_OUT_OF_BOUNDS"
rust_type = "SharedProgram"
programs = [
    { name = "vertex", template = "robustness/vertex_access/r32_uint_vertex_out_of_bounds.vert", stage = "vert" },
    { name = "fragment", template = "robustness/vertex_access/fragment.frag", stage = "frag" },
]

