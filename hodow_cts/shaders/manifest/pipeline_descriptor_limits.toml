# Shader manifest for dEQP-VK.pipeline.monolithic.descriptor_limits.*
#
# `DescriptorLimitTest::initPrograms`: a position pass-through vertex shader and a fragment (or compute) shader that
# reads the last of `descCount` descriptors of the tested type, which is the binding `${binding}` of the template. For
# storage buffers tested from a compute shader the result buffer takes one of the descriptors, so the binding is one lower.

upstream_source = "external/vulkancts/modules/vulkan/pipeline/vktPipelineDescriptorLimitsTests.cpp"
rust_module = "pipeline/descriptor_limits_tests"

[[case]]
name = "comp_samplers_3"
rust_const = "DESCRIPTOR_LIMITS_COMP_SAMPLERS_3"
rust_type = "SharedProgram"
programs = [
