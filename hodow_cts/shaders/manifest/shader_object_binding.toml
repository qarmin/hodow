# Shader manifest for dEQP-VK.shader_object.binding.*
#
# `ShaderObjectBindingDrawCase::initPrograms` (one set per stage whose alternative shader declares an output nothing consumes: the
# `unused` derived value is 0 for none, 1 vert, 2 tesc, 3 tese, 4 geom, 5 frag), `MeshShaderObjectBindingCase::initPrograms`,
# `ShaderObjectBindingCase::initPrograms` (with mesh shaders) and `ShaderObjectUnbindCase::initPrograms`.

