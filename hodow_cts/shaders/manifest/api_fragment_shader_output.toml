# Shader manifest for dEQP-VK.api.fragment_shader_output.*
#
# `initPrograms` writes one output per attachment, whose GLSL type follows the format the
# shader is meant to target (float for unorm/snorm, uvec4 for uint, ivec4 for sint). The
# magic location (attachments / 2) is dropped, or moved past the last attachment, by the
# first two cases. So a program is fixed by the case (`kind`: 0 location_no_attachment,
# 1 attachment_no_location, 2 different_signedness) and the type letters of the shader
# formats (`types`: f, u, s), which keeps the table at the distinct combinations only.

upstream_source = "external/vulkancts/modules/vulkan/api/vktApiFragmentShaderOutputTests.cpp"
rust_module = "api/fragment_shader_output_tests"

[[case]]
name = "k0_ffsu"
rust_const = "FSO_K0_FFSU"
rust_type = "FragmentOutputProgram"
programs = [
    { name = "vert", template = "api/fragment_shader_output.vert", stage = "vert" },
    { name = "frag", template = "api/fragment_shader_output.frag", stage = "frag" },
]
[case.params]
kind = { type = "u32", value = 0 }
types = { type = "str", value = "ffsu" }
[case.derived]
attachments = "4"
magic = "2"
decl0 = "'' if (types[0] if 0 < attachments else '-') == '-' or (magic == 0 and kind == 1) else 'layout(location = %d) out %s color0;' % ((attachments if (magic == 0 and kind == 0) else 0), {'f':'vec4','u':'uvec4','s':'ivec4'}[types[0]])"
body0 = "'' if (types[0] if 0 < attachments else '-') == '-' or (magic == 0 and kind == 1) else 'color0 = %s%s;' % ({'f':'vec4','u':'uvec4','s':'ivec4'}[types[0]], {'f':'(1.0,1.0,1.0,1.0)','u':'(123,123,123,123)','s':'(111,111,111,111)'}[types[0]])"
decl1 = "'' if (types[1] if 1 < attachments else '-') == '-' or (magic == 1 and kind == 1) else 'layout(location = %d) out %s color1;' % ((attachments if (magic == 1 and kind == 0) else 1), {'f':'vec4','u':'uvec4','s':'ivec4'}[types[1]])"
body1 = "'' if (types[1] if 1 < attachments else '-') == '-' or (magic == 1 and kind == 1) else 'color1 = %s%s;' % ({'f':'vec4','u':'uvec4','s':'ivec4'}[types[1]], {'f':'(1.0,1.0,1.0,1.0)','u':'(123,123,123,123)','s':'(111,111,111,111)'}[types[1]])"
decl2 = "'' if (types[2] if 2 < attachments else '-') == '-' or (magic == 2 and kind == 1) else 'layout(location = %d) out %s color2;' % ((attachments if (magic == 2 and kind == 0) else 2), {'f':'vec4','u':'uvec4','s':'ivec4'}[types[2]])"
