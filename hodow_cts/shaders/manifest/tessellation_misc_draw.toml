# Shader manifest for dEQP-VK.tessellation.misc_draw.*
#
# vktTessellationMiscDrawTests.cpp's initPrograms, pre-expanded: the fill_cover/fill_overlap/isolines cases (shared by their draw and
# draw_indirect variants), the TessStateSwitch cases (every case names its two control and evaluation shaders), tess_factor_barrier_bug,
# non_zero_vertex_instance and unused_builtin_outputs.

upstream_source = "external/vulkancts/modules/vulkan/tessellation/vktTessellationMiscDrawTests.cpp"
rust_module = "tessellation/misc_draw_tests"

