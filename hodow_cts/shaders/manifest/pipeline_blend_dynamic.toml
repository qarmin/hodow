# Shader manifest for dEQP-VK.pipeline.*.blend.dynamic_dual_disable.* and blend.drlr_remap.*
#
# `DynamicDualBlendDisableCase::initPrograms`: a full screen strip and a fragment shader writing one constant color to each of the attachments.
# One entry per attachment count (1, 2 and 8, each also with one extra attachment), and the shaders of `RemapCase::initPrograms` (`remap`).

upstream_source = "external/vulkancts/modules/vulkan/pipeline/vktPipelineBlendTests.cpp"
rust_module = "pipeline/blend_dynamic_tests"

[[case]]
name = "dual_disable_1"
rust_const = "DUAL_DISABLE_1"
rust_type = "SharedProgram"
programs = [
    { name = "vert", template = "pipeline/blend_dynamic/dual_disable.vert", stage = "vert" },
    { name = "frag", template = "pipeline/blend_dynamic/dual_disable.frag", stage = "frag" },
]
derived = { frag_source = "'#version 460\\nlayout (location=0) out vec4 outColor0;\\nvoid main(void) {\\n    outColor0 = vec4(0.0, 0.0, 1.0, 1.0);\\n}\\n'" }

