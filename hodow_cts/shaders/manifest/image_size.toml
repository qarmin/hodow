# Shader manifest for dEQP-VK.image.image_size.*
#
# One program per (image type, access qualifiers) and, for 3D, per 2D view of 3D. The format is always
# VK_FORMAT_R32G32B32A32_SFLOAT (`rgba32f`). `flags` is upstream's `SizeTest::TestFlags`: 1 readonly, 2 writeonly.
# The body follows `Texture::dimension()` as in `SizeTest::initPrograms`: a 1D image (and a buffer) returns an int, a
# 2D one (a cube, a 2D view of a 3D image) an ivec2, anything else an ivec3.

upstream_source = "external/vulkancts/modules/vulkan/image/vktImageSizeTests.cpp"
rust_module = "image/size_tests"

[[case]]
name = "1d_flags1"
rust_const = "SIZE_1D_RO"
rust_type = "ImageSizePrograms"
programs = [{ name = "comp", template = "image/image_size.comp", stage = "comp" }]
params = { kind = { type = "str", value = "1d" }, flags = { type = "u32", value = 1 }, view_2d = { type = "bool", value = false }, access = { type = "str", value = " readonly" }, glsl_type = { type = "str", value = "image1D" }, body = { type = "str", value = "    sb_out.size = ivec3(imageSize(u_image), 0, 0);" } }

[[case]]
name = "1d_flags2"
rust_const = "SIZE_1D_WO"
rust_type = "ImageSizePrograms"
programs = [{ name = "comp", template = "image/image_size.comp", stage = "comp" }]
params = { kind = { type = "str", value = "1d" }, flags = { type = "u32", value = 2 }, view_2d = { type = "bool", value = false }, access = { type = "str", value = " writeonly" }, glsl_type = { type = "str", value = "image1D" }, body = { type = "str", value = "    sb_out.size = ivec3(imageSize(u_image), 0, 0);" } }

