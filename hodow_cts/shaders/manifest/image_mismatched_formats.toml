# Shader manifest for dEQP-VK.image.mismatched_formats.{image_read,image_write,sparse_image_read}.*
#
# `initPrograms` picks one of three sources and specializes `${FORMAT}`, `${IMAGE}`,
# `${VECT}` and `${VALUE}` from the SPIR-V format named in the case. The last three follow only from the channel class
# of that format, so each of the six (kind, class) pairs is one template and only the format qualifier is substituted;
# `glsl_format` is the table's `GLSLFormat`, or the lower-cased SPIR-V name where the table holds none.

upstream_source = "external/vulkancts/modules/vulkan/image/vktImageMismatchedFormatsTests.cpp"
rust_module = "image/mismatched_formats_tests"

[[case]]
name = "read_Rgba32f"
rust_const = "READ_RGBA32F"
rust_type = "MismatchedFormatPrograms"
programs = [{ name = "comp", template = "image/mismatched_formats_read_float.comp", stage = "comp" }]
params = { kind = { type = "str", value = "read" }, spirv_format = { type = "str", value = "Rgba32f" }, glsl_format = { type = "str", value = "rgba32f" } }

[[case]]
name = "read_Rg32f"
