# Shader manifest for dEQP-VK.renderpasses.*.suballocation.attachment_sparse_filling.*
#
# `InputAttachmentSparseFillingTest::initPrograms`: the fragment shader reads N input attachments whose `input_attachment_index`
# values come from `generateInputAttachmentParams` (a Fisher-Yates shuffle with seed 31 of 2N slots), which differs between the
# render pass variants and dynamic rendering, so there is one fragment shader per (rendering kind, N). The files are the
# upstream generator's output for those parameters, written out by a one-off shell implementation of deRandom.

upstream_source = "external/vulkancts/modules/vulkan/renderpass/vktRenderPassUnusedAttachmentSparseFillingTests.cpp"
rust_module = "renderpass/unused_attachment_sparse_filling_tests"

[[case]]
name = "rp_1"
rust_const = "SPARSE_FILL_RP_1"
rust_type = "SharedProgram"
programs = [
    { name = "vertex", template = "renderpass/unused_attachment_sparse_filling/vertex.vert", stage = "vert" },
    { name = "fragment", template = "renderpass/unused_attachment_sparse_filling/fragment_rp_1.frag", stage = "frag" },
]

