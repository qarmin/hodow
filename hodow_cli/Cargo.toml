[package]
name = "hodow_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "hodow_cli"
path = "src/main.rs"

[dependencies]
hodow_core = { path = "../hodow_core" }
log.workspace = true
handsome_logger = { version = "0.9.2", default-features = false }
clap = { version = "4.6", features = ["derive"] }
indicatif = "0.18.6"
ctrlc = "3.5"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time", "net", "macros"], optional = true }
axum = { version = "0.8", features = ["ws"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["gpu", "serve"]
miri_build = ["hodow_core/miri_build"]
# Forward the gpu feature to the core crate so dependency-gated cfgs work
gpu = ["hodow_core/gpu"]
# Vulkan compute validation
vulkan = ["hodow_core/vulkan"]
# Job-queue server (`hodow_cli serve`) + remote job submission (`--submit-to`)
serve = ["dep:tokio", "dep:axum", "dep:ureq"]

[lints]
workspace = true
