[package]
name = "hodow_cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "work_tester"
path = "src/main.rs"

[dependencies]
hodow_core = { path = "../hodow_core" }
log.workspace = true
handsome_logger = { version = "0.9.2", default-features = false }
clap = { version = "4.3", features = ["derive"] }
indicatif = "0.18.4"
ctrlc = "3.4"

[features]
default = ["gpu"]
miri_build = ["hodow_core/miri_build"]
# Forward the gpu feature to the core crate so dependency-gated cfgs work
gpu = ["hodow_core/gpu"]

[lints]
workspace = true
