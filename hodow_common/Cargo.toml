[package]
name = "hodow_common"
version = "0.1.0"
authors = ["Rafał Mikrut <mikrutrafal@protonmail.com>"]
edition = "2024"
rust-version = "1.98"
description = "Shared parts of hodow: the event protocol, progress tree, results store and data directory"
license = "Apache-2.0"
repository = "https://github.com/qarmin/hodow"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
