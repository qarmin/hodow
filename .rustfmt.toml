newline_style = "Unix"
max_width = 120

# Enable only with nightly channel via - cargo +nightly fmt
imports_granularity = "Module"
group_imports = "StdExternalCrate"

# The CPU test suite is scripts/cpu/generate_tests.py's raw output, and regeneration has to
# stay diff-clean: formatting it makes the very next `just gen-cpu-tests` rewrite 45k lines
# back. `just fix` runs a workspace-wide fmt, so this has to be here and not just a rule
# people remember.
# Same for hodow_cts's generated trees - compile_shaders.py, gen_api_wrappers.py and
# gen_shader_library.py each check their own output with `--check`, which a reformat breaks.
# Generated files outside those trees (each has a "Generated by" header); the generators format them at max_width = 180.
ignore = [
    "hodow_cpu/src/cpu/auto_generated",
    "hodow_cts/src/generated",
    "hodow_cts/src/vkt/tests/renderpass/local_read_m10_programs.rs",
    "hodow_cts/src/vkt/tests/reconvergence/compute_cases.rs",
    "hodow_cts/src/vkt/tests/sparse_resources/null_address_programs.rs",
    "hodow_cts/src/vkt/tests/sparse_resources/texel_programs.rs",
    "hodow_cts/src/vkt/tests/ycbcr/storage_write_programs.rs",
    "hodow_cts/src/vkt/tests/info/extension_dependencies.rs",
    "hodow_cts/src/vkt/tests/info/mandatory_features.rs",
    "hodow_cts/src/vk_main.rs",
    "hodow_cts/src/vkt/tests_main.rs",
    "hodow_cts/src/vk_a.rs",
    "hodow_cts/src/vkt/tests_a.rs",
