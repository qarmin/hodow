[package]
name = "work_tester_core"
version.workspace = true
edition.workspace = true

[dependencies]
log.workspace = true
once_cell.workspace = true
rand.workspace = true

# Optional GPU dependencies
glutin = { version = "0.32.3", optional = true }
glutin-winit = { version = "0.5.0", default-features = false, features = ["egl", "x11", "wayland"], optional = true }
glow = { version = "0.16.0", optional = true }
gl = { version = "0.14", optional = true }
winit = { version = "0.30", optional = true }
raw-window-handle = { version = "0.6.2", optional = true }

[features]
miri_build = []
# Feature to enable OpenGL GPU support
# Include `winit` (GUI) as part of the `gpu` feature so GUI compiles whenever gpu is enabled.
# Keep GUI control at runtime via arguments.
gpu = ["glutin", "glutin-winit", "glow", "gl", "raw-window-handle", "winit"]

[lints]
workspace = true
