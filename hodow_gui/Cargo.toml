[package]
name = "hodow_gui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "hodow_gui"
path = "src/main.rs"

[dependencies]
hodow_core = { path = "../hodow_core" }
slint = "1.9"
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "time"] }
log.workspace = true
handsome_logger = { version = "0.9.2", default-features = false }

[build-dependencies]
slint-build = "1.9"

[features]
default = ["gpu"]
gpu = ["hodow_core/gpu"]

[lints]
workspace = true
